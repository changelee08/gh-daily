ild in public\" like a superstar", "url": "https://fakemetrics.com/", "hn_url": "https://news.ycombinator.com/item?id=50520741", "points": 41, "comments": 19, "github": null, "title_zh": "Fakemetrics.com——像超级巨星一样「公开构建」"}, {"title": "Umbrella – macOS app to capture audio from any app", "url": "https://umbrella.pixelegg.me/", "hn_url": "https://news.ycombinator.com/item?id=50503097", "points": 31, "comments": 10, "github": null, "title_zh": "Umbrella——macOS 应用，可捕获任意应用的音频"}], "papers": [{"id": "2611.18359", "title": "Envisioning Agentic Robotics: A New Era of Robotic Systems", "upvotes": 107, "summary": "Agentic robotics, centered on an Embodied System 2 formed by a foundation model and embodied harness, requires a shared evaluation framework and research roadmap to achieve reliable physical autonomy.", "url": "https://huggingface.co/papers/2611.18359", "github": null, "summary_zh": "提出以基础模型加具身框架构成的具身系统2，主张建立共享评估框架与研究路线图，以实现可靠的物理自主。"}, {"id": "2611.18397", "title": "Gamer: A Generalist Vision-Language-Action Foundation Model for Long-Horizon Real-Time Game Agent", "upvotes": 88, "summary": "Gamer is a generalist agent framework that integrates perception, memory, and multi-step reasoning, trained through continued pre-training, sparse-thinking instruction tuning, and multi-turn reinforcement learning to interact efficiently in 2D and 3D environments.", "url": "https://huggingface.co/papers/2611.18397", "github": "https://github.com/RainBowLuoCS/Gamer", "summary_zh": "提出通用游戏智能体Gamer，融合感知、记忆与多步推理，经持续预训练和多轮强化学习，可在2D与3D环境中高效交互。"}, {"id": "2611.15789", "title": "VibePrevisBench: Evaluating Agentic Coding for 4D Scene Generation in Blender", "upvotes": 84, "summary": "Controllable real-world video generation models can condition on a rendered graybox proxy video, which fixes layout, motion and camera. Coding agents can build such videos by reconstructing a 4D scene in Blender, yet no benchmark checks both these videos and the long, multi-shot scenes behind them. ", "url": "https://huggingface.co/papers/2611.15789", "github": "https://github.com/vibeprevisbench/vibeprevisbench", "summary_zh": "提出VibePrevisBench基准，检验编码智能体在Blender中重建4D场景、生成可控视频与多镜头长场景的能力。"}, {"id": "2611.12068", "title": "MIRIX-2.0: Multi-Agent Memory System", "upvotes": 47, "summary": "MIRIX-2.0 is a multi-agent memory system for LLM agents that achieves high accuracy and efficiency across QA and procedural benchmarks without fine-tuning.", "url": "https://huggingface.co/papers/2611.12068", "github": "https://github.com/Mirix-AI/MIRIX", "summary_zh": "提出MIRIX-2.0多智能体记忆系统，无需微调即可在问答和流程类基准上取得高准确率与高效率。"}, {"id": "2611.18482", "title": "MMFlash: Faster Speculative Decoding for Vision-Language Models", "upvotes": 35, "summary": "MMFlash improves multimodal speculative decoding by adaptively upweighting visually dependent tokens and using sparse attention for long video, yielding up to 3.58× lossless speedup.", "url": "https://huggingface.co/papers/2611.18482", "github": "https://github.com/fscdc/MMFlash", "summary_zh": "提出MMFlash，通过自适应提升视觉相关token权重和长视频稀疏注意力，加速多模态投机解码，最高可达3.58倍无损加速。"}, {"id": "2611.12901", "title": "Rethinking in Spikes: Mitigating Hallucinations in MDLMs with Step-Aware Decoding", "upvotes": 35, "summary": "StepRefine, a plug-and-play decoding strategy, mitigates hallucinations in multimodal diffusion language models by switching between discrete denoising and latent refinement based on entropy spikes and distributional stability.", "url": "https://huggingface.co/papers/2611.12901", "github": "https://github.com/mdlm-steprefine/mdlm-steprefine", "summary_zh": "提出StepRefine解码策略，依据熵尖峰和分布稳定性在离散去噪与潜在精修间切换，缓解多模态扩散语言模型的幻觉。"}, {"id": "2611.17831", "title": "V-JEPA-LM: Video-Language Models That Read Dynamics Beyond Static, Text-Aligned Representations", "upvotes": 22, "summary": "Counterfactual supervision over pixel transformations enables language models to read motion dynamics from frozen predictive video encoders, yielding V-JEPA-LM models that outperform open video LLMs across benchmarks.", "url": "https://huggingface.co/papers/2611.17831", "github": "https://github.com/kkt94/Llama-V-JEPA-LM", "summary_zh": "通过像素变换的反事实监督，让语言模型从冻结的预测式视频编码器中读取运动动态，提出的V-JEPA-LM优于开源视频大模型。"}, {"id": "2611.17878", "title": "DySENSE: Dynamic Spatiotemporal ENergy Synthesis and Emulation with Satellite Imagery", "upvotes": 20, "summary": "Cities account for over two-thirds of the world's energy and more than 70% of global carbon dioxide emissions. City energy is essential for achieving the 2050 net-zero target and the UN's Sustainable Development Goals 7 and 11. Although existing studies have made progress, they are limited by data a", "url": "https://huggingface.co/papers/2611.17878", "github": "https://github.com/kailaisun/DySENSE", "summary_zh": "利用卫星影像构建城市动态时空能源合成与仿真框架DySENSE，服务城市能源与碳排放研究。"}, {"id": "2611.07226", "title": "Loopback Transformer: Towards a Unified View of Residual Looped Transformers", "upvotes": 20, "summary": "A looped Transformer that separately controls input strength, total update weight, and per-update allocation achieves lower validation loss and higher downstream accuracy than standard and looped residual baselines while using fewer parameters.", "url": "https://huggingface.co/papers/2611.07226", "github": "https://github.com/yancyou/Loopback", "summary_zh": "提出循环残差Transformer的统一视角，独立控制输入强度、总更新权重与各轮更新分配，以更少参数取得更低损失和更高准确率。"}, {"id": "2611.13509", "title": "Mobile AI Factory: Building Specialized Language Models for Your Mobile Device", "upvotes": 19, "summary": "Mobile AI Factory is an agentic system that automatically builds task- and phone-specific fine-tuned quantized small language models, using an orchestrator LLM, real device measurements, and adaptive search to match or outperform larger models with much less GPU time.", "url": "https://huggingface.co/papers/2611.13509", "github": "https://github.com/evanly-gh/SLM_Factory", "summary_zh": "提出Mobile AI Factory，由编排LLM结合真机测量与自适应搜索，自动构建面向特定任务和手机的量化小语言模型。"}, {"id": "2611.17334", "title": "Unbundling Multimodal Vision Encoding", "upvotes": 19, "summary": "Controlled experiments show that multimodal language models do not need a pretrained vision encoder, but benefit from dedicated vision capacity trained jointly with the backbone and integrated early rather than before fusion.", "url": "https://huggingface.co/papers/2611.17334", "github": null, "summary_zh": "通过受控实验发现多模态语言模型无需预训练视觉编码器，但需要与主干联合训练、在融合早期集成的专用视觉容量。"}, {"id": "2611.17814", "title": "G-CAST: Governed Continual Self-Training for E-Commerce Agents under Evolving Demands", "upvotes": 17, "summary": "With the rapid advancement of Large Language Models (LLMs), an increasing number of users are turning to LLM-powered agents for conversational shopping in e-commerce. However, the user needs continue to change as new product categories, procurement scenarios, and feature requests emerge. At the same", "url": "https://huggingface.co/papers/2611.17814", "github": null, "summary_zh": "提出G-CAST，一种受治理的持续自训练方法，使电商对话购物智能体能适应不断变化的用户需求。"}, {"id": "2611.18338", "title": "MEM-SQL: Memory-Empowered Text-to-SQL", "upvotes": 17, "summary": "A history-aware benchmark and memory-powered method improve Text-to-SQL accuracy and reduce cost by reusing verified SQL components and consulting schemas on demand.", "url": "https://huggingface.co/papers/2611.18338", "github": null, "summary_zh": "提出MEM-SQL，结合历史感知基准与记忆机制，复用已验证SQL组件并按需查询模式，提升Text-to-SQL准确率并降低成本。"}, {"id": "2611.18549", "title": "JVT: Just Video Transformer makes pixel-space video diffusion simple", "upvotes": 15, "summary": "JVT, a simple large-patch DiT-style Transformer, enables pixel-space video diffusion without pretrained autoencoders or U-Net skip connections, achieving competitive quality and supporting joint camera-conditioned RGB-disparity generation.", "url": "https://huggingface.co/papers/2611.18549", "github": "https://github.com/ZhouTimeMachine/JVT", "summary_zh": "提出JVT，一种大分块DiT式Transformer，无需自编码器和U-Net跳连即可做像素空间视频扩散，并支持RGB与视差联合生成。"}, {"id": "2610.41354", "title": "OneSteer: Unlocking Steerable General Humanoid Motion Tracking via One-Step Diffusion Whole-Body Control", "upvotes": 12, "summary": "Deployment objectives often specify desired outcomes without providing revised trajectories, while parts of the original reference must still be followed. We present OneSteer, a one-step diffusion whole-body controller that combines general motion tracking with selective test-time steering. To accom", "url": "https://huggingface.co/papers/2610.41354", "github": null, "summary_zh": "提出OneSteer，一种一步扩散全身控制器，结合通用动作跟踪与测试时选择性引导，实现可操控的人形机器人运动跟踪。"}, {"id": "2611.17820", "title": "Aligning AI Teams", "upvotes": 12, "summary": "Alignment training on individual LLM agents often fails to transfer to multi-agent teams, but designating a safety lead and having a coordinator publish safety specifications can restore single-agent alignment.", "url": "https://huggingface.co/papers/2611.17820", "github": null, "summary_zh": "发现单个LLM智能体的对齐训练难以迁移到多智能体团队，指定安全负责人并由协调者发布安全规范可恢复对齐。"}, {"id": "2611.06866", "title": "GH-AWTrace: A Large-Scale Dataset of GitHub Agentic Workflow Execution Logs", "upvotes": 12, "summary": "Agentic workflows enable AI agents to perform recurring repository tasks on schedules or in response to repository events. Existing studies examine workflow definitions and outputs, but provide limited evidence of what happens during execution. We present GH-AWTrace, a dataset linking 25,014 verifie", "url": "https://huggingface.co/papers/2611.06866", "github": null, "summary_zh": "提出GH-AWTrace数据集，收录25014条GitHub智能体工作流执行日志，记录执行过程中的细节。"}, {"id": "2611.17955", "title": "WebArena-Pro: A Heterogeneous, Multimodal, Reproducible Benchmark for Web Agents", "upvotes": 11, "summary": "Web agents powered by large language and vision-language models are increasingly applied to realistic browser work that spans heterogeneous applications, multimodal content, and stateful workflows. However, existing reproducible web-agent benchmarks cover only a small number of web applications draw", "url": "https://huggingface.co/papers/2611.17955", "github": "https://github.com/McGill-NLP/webarena-pro", "summary_zh": "提出WebArena-Pro，一个异构、多模态、可复现的网页智能体基准，覆盖更多应用、多模态内容与有状态工作流。"}, {"id": "2611.18429", "title": "Do Underwater Image Quality Metrics Agree with Human Perception? A Benchmark with Human Choices, Simple Edits and Generative Drift", "upvotes": 11, "summary": "Underwater image enhancement is challenging to evaluate due to the lack of clean reference images, so researchers rely on no-reference image quality assessment (NR-IQA) metrics. However, it remains unclear whether these metrics agree with human judgments. We evaluate 73 handcrafted underwater, learn", "url": "https://huggingface.co/papers/2611.18429", "github": "https://github.com/TrustUIQA/TrustUIQA", "summary_zh": "构建水下图像质量基准，检验73种指标是否与人类感知一致，并考察生成式漂移的影响。"}, {"id": "2611.16378", "title": "Evidence-Governed Adoption of Self-Generated Updates in Autonomous AI Agents", "upvotes": 11, "summary": "A governance framework separates generation from adoption of self-modifying autonomous-agent changes, using fresh paired audits, non-inferiority checks, and calibrated statistical bounds to confirm improvements before bounded deployment.", "url": "https://huggingface.co/papers/2611.16378", "github": null, "summary_zh": "提出自修改智能体更新的治理框架，将生成与采纳分离，经配对审计和统计界限确认改进后再有限部署。"}]};
const ARCHIVE = ["2026-11-17", "2026-11-16", "2026-11-15", "2026-11-14", "2026-11-13", "2026-11-12", "2026-11-11", "2026-11-10", "2026-11-09", "2026-11-06", "2026-11-05", "2026-11-04", "2026-11-03", "2026-11-02", "2026-11-01", "2026-10-30"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
let D, cat = "全部";

// 收藏 / 已读：存在本浏览器
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("ghd:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ghd:" + k, JSON.stringify(v)); } catch {} },
};
let favs = store.get("favs", {}), read = new Set(store.get("read", []));
const saveRead = () => store.set("read", [...read].slice(-3000));

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) return "";
  const W = 64, H = 18, pts = ys.map((y, i) =>
    `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 2 - (y - lo) / (hi - lo) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="近 ${trend.length} 天 star 曲线">
    <title>${esc(trend[0][0])} ★${fmt(ys[0])} → ${esc(trend.at(-1)[0])} ★${fmt(ys.at(-1))}</title>
    <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function card(p) {
  const [owner, repo] = p.name.split("/");
  const flags = p.flags || [], related = p.related || [];
  const flagBadge = (kind, label) => flags.some(f => f.kind === kind) ? `<span class="badge warn">${label}</span>` : "";
  const relLabel = related.every(r => r.reason === "同作者") ? "同作者" : "同类";
  return `<article class="card ${p.suspect ? "suspect" : ""} ${read.has(p.name) ? "read" : ""}">
    <div class="top"><img src="${esc(p.owner_avatar)}&s=56" alt="" loading="lazy">
      <div class="name"><a class="main" href="${esc(p.url)}" target="_blank" rel="noopener" data-name="${esc(p.name)}"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a></div>
      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="d">${esc(p.summary_zh || p.summary)}</div>
      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
