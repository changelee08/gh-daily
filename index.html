better candidate artifacts or rank methods, so progress requires making true improvements detectable and accumulable.", "url": "https://huggingface.co/papers/2611.23068", "github": null, "summary_zh": "智能体进化常受噪声评估制约，难以识别更优候选，因此需要让真正的改进可被检测并能不断累积。"}, {"id": "2611.21366", "title": "ALIVE: Making Streaming Video Models Interactive", "upvotes": 32, "summary": "Streaming video LLMs can continuously observe the world, yet often handle user requests in isolation. We introduce ALIVE, an interactive streaming video model supporting proactive monitoring, streaming task coordination, and feedback-seeking interaction. We construct ALIVE-SFT-288K and ALIVE-RL-3K f", "url": "https://huggingface.co/papers/2611.21366", "github": "https://github.com/lijinzhao30/ALIVE", "summary_zh": "提出交互式流式视频模型ALIVE，支持主动监控、流式任务协调与反馈询问，并构建相应的SFT与RL数据集。"}, {"id": "2611.11318", "title": "PROLA: Principal-Orthogonal Low-rank Adaptation for Predictive Spatiotemporal Weather Downscaling", "upvotes": 27, "summary": "High-resolution weather prediction is important for resolving local atmospheric patterns missed by coarse global forecasts. Large pretrained weather backbones have improved global forecasting, but adapting them to produce future high-resolution fields from recent coarse states remains challenging an", "url": "https://huggingface.co/papers/2611.11318", "github": "https://github.com/yms020615/PROLA", "summary_zh": "提出主成分正交低秩适应方法PROLA，将预训练天气大模型适配为基于粗粒度近期状态预测未来高分辨率天气场。"}, {"id": "2611.24154", "title": "Game2Player: Scaling Gameplay Experience for Visual Agents through Environment-Player Co-Development", "upvotes": 25, "summary": "Games are a rich testbed for visual agents, demanding perception, long-horizon planning, and precise control. However, collecting human gameplay is costly, and learning from gameplay videos requires inferring missing actions. Existing datasets also cover a limited range of games, often without expli", "url": "https://huggingface.co/papers/2611.24154", "github": "https://github.com/game2player/Game2Player", "summary_zh": "通过环境与玩家协同开发扩展游戏经验数据，降低收集人类游戏视频的成本，为视觉智能体提供覆盖更多游戏的训练资源。"}, {"id": "2611.24654", "title": "CurvDelta: Low-Curvature Delta Modeling For Surgical Learning and Unlearning", "upvotes": 22, "summary": "CurvDelta and CurvLoRA constrain LLM updates to a low-curvature preservation space, improving retention while maintaining target adaptation across reasoning, code, and unlearning tasks.", "url": "https://huggingface.co/papers/2611.24654", "github": null, "summary_zh": "提出CurvDelta与CurvLoRA，将大语言模型更新约束在低曲率保留空间内，在推理、代码和遗忘任务上兼顾保留与目标适应。"}, {"id": "2611.24789", "title": "HINT-WAM: Hindsight-Informed Training for World Action Models", "upvotes": 22, "summary": "World action models (WAMs) have shown promising generalization and data efficiency in robot manipulation by coupling action generation with predictions of future visual dynamics. Translating these capabilities into reliable task execution, however, remains a challenge for existing post-training meth", "url": "https://huggingface.co/papers/2611.24789", "github": "https://github.com/tuandattt/hintwam_code", "summary_zh": "提出后见信息训练方法，利用事后信息改进世界动作模型的后训练，提升机器人操作任务的可靠执行能力。"}, {"id": "2611.17600", "title": "LightTAR: Light and Fast Target-Aware Representations for Multimodal Tabular Learning", "upvotes": 20, "summary": "LightTAR adapts dimensionality reduction to the prediction task by adding target-aware features from encoder layers via regularized partial least squares, improving multimodal tabular model performance with minimal runtime overhead.", "url": "https://huggingface.co/papers/2611.17600", "github": "https://github.com/eilamshapira/LightTAR", "summary_zh": "通过正则化偏最小二乘从编码器层引入目标感知特征，使降维适配预测任务，以极小开销提升多模态表格学习性能。"}, {"id": "2611.24869", "title": "WorldRuler: Interactive World Modeling under Configurable Rules", "upvotes": 18, "summary": "A rule-graph-based generative world model preserves user-defined rules and world states across saving and loading while accurately realizing rule-induced visual changes on designated objects and attributes.", "url": "https://huggingface.co/papers/2611.24869", "github": "https://github.com/AlayaLab/WorldRuler", "summary_zh": "提出基于规则图的生成式世界模型，在保存与加载时保持用户定义的规则与世界状态，并准确实现规则引发的指定视觉变化。"}, {"id": "2611.22925", "title": "Code World Model 2.0: Towards Infinite Controllable Video Generation", "upvotes": 15, "summary": "Visual proxies decouple explicit world-state simulation from photorealistic video synthesis, offering a controllable interface for both offline clip creation and real-time interactive streaming. Yet a practical renderer must address two challenges. Upstream proxies vary from coarse layouts to fine a", "url": "https://huggingface.co/papers/2611.22925", "github": "https://github.com/inclusionAI/CodeWorldModel", "summary_zh": "利用视觉代理解耦显式世界状态模拟与真实感视频合成，为离线片段生成和实时交互流式生成提供可控接口。"}, {"id": "2611.24408", "title": "StrideWorld: Benchmarking Scene Rigidity and Action Consistency in Interactive Video World Model", "upvotes": 13, "summary": "StrideWorld is a benchmark that fixes references before motion to detect scene deformation and action inconsistency in interactive video world models, showing that most models deform scenes and only depth-scaled command models preserve composed routes.", "url": "https://huggingface.co/papers/2611.24408", "github": "https://github.com/chuangwang123/strideworld", "summary_zh": "提出交互式视频世界模型基准StrideWorld，运动前固定参考以检测场景形变与动作不一致，发现多数模型会形变场景。"}, {"id": "2611.22287", "title": "Decoding Without a Decoder: Direct Pixel Prediction from Diffusion Transformers", "upvotes": 12, "summary": "A method that removes the decoder from latent diffusion models by adding a final-step prediction head to a finetuned diffusion transformer, reducing inference cost and improving pixel quality in image and video generation.", "url": "https://huggingface.co/papers/2611.22287", "github": null, "summary_zh": "在微调后的扩散Transformer上添加末步预测头，去除潜在扩散模型的解码器，降低推理成本并提升图像和视频的像素质量。"}, {"id": "2611.23388", "title": "QDA: Closed-Loop LLM Quantization Design with Agents", "upvotes": 12, "summary": "Post-training quantization is the standard way to serve large language models at low cost. However, the best quantization recipe differs across models and precisions. As a result, experts must redesign it for every new model, which is time-consuming and often sub-optimal. Fortunately, an LLM agent c", "url": "https://huggingface.co/papers/2611.23388", "github": null, "summary_zh": "提出基于LLM智能体的闭环量化方案设计方法，为不同模型和精度自动搜索训练后量化配方，减少专家的人工设计成本。"}, {"id": "2611.24651", "title": "Piccolo: Co-Evolving Decision Models and Data through Recursive Self-Improvement", "upvotes": 11, "summary": "We present Piccolo, a family of multimodal decision models (0.8B to 27B) that coevolves model capabilities and training data via Agentic Data Engineering and recursive self-improvement (RSI). The models predict probabilities over candidate answers for general-purpose text and visual judgments, agent", "url": "https://huggingface.co/papers/2611.24651", "github": "https://github.com/agentscope-ai/Piccolo", "summary_zh": "提出0.8B至27B的多模态决策模型家族Piccolo，通过智能体数据工程和递归自我改进共同演化模型能力与训练数据。"}, {"id": "2611.19200", "title": "LogT: Logically Think with Images for Visual Search", "upvotes": 10, "summary": "Thinking with images empowers vision-language models (VLMs) to use an external Zoom-in tool for fine-grained visual search. Recent works employ supervised fine-tuning (SFT) and reinforcement learning (RL) with tool-specific designs to enable such capabilities. However, achieving logical reasoning al", "url": "https://huggingface.co/papers/2611.19200", "github": null, "summary_zh": "提出LogT，使视觉语言模型借助图像进行逻辑推理，以增强带放大工具的细粒度视觉搜索能力。"}, {"id": "2611.21553", "title": "BLIP-Live: Balancing Timeliness & Firing Precision in Proactive Streaming Video Agents", "upvotes": 9, "summary": "BLIP-Live unifies data, metrics, inference, and training for proactive streaming video understanding, using the PAUC-F metric and achieving state-of-the-art results on proactive streaming benchmarks.", "url": "https://huggingface.co/papers/2611.21553", "github": null, "summary_zh": "提出统一数据、指标、推理与训练的主动流式视频理解框架BLIP-Live，采用PAUC-F指标，在相关基准上取得最优结果。"}, {"id": "2611.23257", "title": "StatePortal: Agentic Checkpoint Synthesis for Testing Deep States in Interactive Software", "upvotes": 9, "summary": "Large language models have reduced the effort to generate code for interactive software with graphical user interfaces (GUIs). For such software, a key testing bottleneck is reaching a deep state, one that requires a long interaction history. The cost of reaching it recurs across commits, and the GU", "url": "https://huggingface.co/papers/2611.23257", "github": "https://github.com/pzy2000/State_Portal", "summary_zh": "提出基于智能体的检查点合成方法StatePortal，自动生成深层状态用于测试图形界面软件，降低反复到达深层状态的成本。"}, {"id": "2611.23808", "title": "PReMind: When Personal Memory Meets Visual Hazards", "upvotes": 9, "summary": "A diagnostic benchmark and two-phase reinforcement learning framework enable personalized vision-language assistants to jointly connect visual hazard evidence with personal memory for appropriate responses.", "url": "https://huggingface.co/papers/2611.23808", "github": null, "summary_zh": "提出诊断性基准与两阶段强化学习框架，使个性化视觉语言助手能把视觉危险证据与个人记忆结合，给出恰当回应。"}, {"id": "2611.24576", "title": "Late Entry in Looped Language Models", "upvotes": 9, "summary": "Looped language models deepen reasoning at a compact parameter count by iterating a shared layer stack T times per token, turning recurrence depth directly into sequential decoding latency. Conventional early-exit decoding halts after initial passes without cache completion, truncating cached key-va", "url": "https://huggingface.co/papers/2611.24576", "github": "https://github.com/Xalp/LateComer", "summary_zh": "针对循环语言模型深度递归带来的解码延迟，分析传统提前退出解码因缓存不完整而截断键值缓存的问题。"}, {"id": "2611.24098", "title": "RoughCut-Bench: A Benchmark for Automatic Video Rough-Cut with Large Vision-Language Models", "upvotes": 9, "summary": "A new benchmark and agentic workflows assess vision-language models for automatic video rough-cut, revealing current models struggle to match expert cut plans.", "url": "https://huggingface.co/papers/2611.24098", "github": "https://github.com/Whalesong-zrs/RoughCut-Bench", "summary_zh": "提出视频粗剪自动化基准RoughCut-Bench与智能体工作流，评估大型视觉语言模型的粗剪能力，发现现有模型难以匹配专家剪辑方案。"}]};

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) return "";
  const W = 64, H = 18, pts = ys.map((y, i) =>
    `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 2 - (y - lo) / (hi - lo) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="近 ${trend.length} 天 star 曲线">

      <div class="name"><a class="main" href="${esc(p.url)}" target="_blank" rel="noopener" data-name="${esc(p.name)}"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a></div>
      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="d">${esc(p.summary_zh || p.summary)}</div>
      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
