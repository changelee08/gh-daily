": "https://github.com/Koppar-AI/koppar-lte-modem", "hn_url": "https://news.ycombinator.com/item?id=50317331", "points": 61, "comments": 43, "github": "koppar-ai/koppar-lte-modem", "title_zh": "一款 USB-C LTE 调制解调器，让我的电脑接上电话线"}, {"title": "BBRouter – Ben Eater's 8-bit computer, simulated on 3D breadboards", "url": "https://bbrouter.com/bbrouter/ben-eater-sap-1", "hn_url": "https://news.ycombinator.com/item?id=50321522", "points": 57, "comments": 14, "github": null, "title_zh": "BBRouter：在 3D 面包板上模拟的 Ben Eater 8 位计算机"}], "papers": [{"id": "2610.36545", "title": "FrameForge: Harnessing Priors of Video Foundation Models for Unified Image Generation", "upvotes": 112, "summary": "FrameForge enables adaptive conditional image generation by modeling variable condition-target relationships through dynamic temporal experts and intermediate reasoning pathways in pretrained video models.", "url": "https://huggingface.co/papers/2610.36545", "github": "https://github.com/Lyne1/FrameForge", "summary_zh": "FrameForge利用预训练视频模型的先验，通过动态时序专家和中间推理路径，实现对可变条件与目标关系的自适应条件图像生成。"}, {"id": "2610.22740", "title": "R^2Orch: Recursive Self-Improvement for Agent Orchestration via Self-Play within a Skill-Internalization Loop", "upvotes": 89, "summary": "R²Orch uses recursive self-play with learnable task selection and skill withdrawal to train orchestrators without hand-designed curricula, improving performance across reasoning and interactive tasks.", "url": "https://huggingface.co/papers/2610.22740", "github": null, "summary_zh": "R²Orch通过「技能内化」循环中的递归自我对弈，结合可学习的任务选择与技能撤回，无需人工设计课程即可训练编排器，提升推理与交互任务表现。"}, {"id": "2610.39302", "title": "Proving and Improving the Platonic Representation Hypothesis with JEPAs", "upvotes": 71, "summary": "Joint-embedding predictive architectures trained on aligned multi-modal observations converge to shared representations with far greater efficiency than next-token prediction, demonstrating that positive view design—not scale alone—drives cross-modal alignment.", "url": "https://huggingface.co/papers/2610.39302", "github": "https://github.com/galilai-group/prh-proof", "summary_zh": "研究表明，在对齐的多模态观测上训练的JEPA能以远高于下一词预测的效率收敛到共享表示，证明正视图设计而非单纯规模驱动跨模态对齐。"}, {"id": "2610.39497", "title": "Does Scaling Toward AGI Depend on What System-1 Lets System-2 Execute?", "upvotes": 59, "summary": "Co-designing a resource-heavy reasoning system with a lightweight predictive evaluator can reduce execution costs by filtering interactions, with efficiency governed by the density of useful interactions.", "url": "https://huggingface.co/papers/2610.39497", "github": null, "summary_zh": "将资源密集型推理系统与轻量预测评估器协同设计，通过过滤交互降低执行成本，效率由有用交互的密度决定。"}, {"id": "2610.42053", "title": "REA: A Routed Embodied Agent Runtime for Asynchronous Brain-Cerebellum Control", "upvotes": 44, "summary": "REA unifies deliberative and reactive policies in a single runtime with asynchronous coordination, achieving high success rates with reduced control overhead across simulated and real robot tasks.", "url": "https://huggingface.co/papers/2610.42053", "github": null, "summary_zh": "REA是一个路由式具身智能体运行时，在单一框架中统一审慎与反应策略并异步协调，在仿真和真实机器人任务中以更低控制开销取得高成功率。"}, {"id": "2610.40738", "title": "Apriel Voice 27B Preview: An Open Model for Speech, Reasoning, and Tool Use", "upvotes": 34, "summary": "Apriel Voice 27B Preview is an open speech-language model that integrates speech understanding, reasoning, and tool use within a shared backbone, achieving strong results on audio benchmarks through a two-stage training procedure with online distillation.", "url": "https://huggingface.co/papers/2610.40738", "github": null, "summary_zh": "Apriel Voice 27B Preview是一个开源语音语言模型，在共享主干中整合语音理解、推理与工具调用，并通过两阶段在线蒸馏训练，在音频基准上表现出色。"}, {"id": "2610.16927", "title": "WeFair: Fidelity-Aware Alignment from Human Feedback for Personalized Query Rewriting in Short-Video Search", "upvotes": 26, "summary": "WeFair improves personalized query rewriting via fidelity-aware human feedback stages—demonstration, preference, and verification—to reduce intent drift and boost search effectiveness in short-video platforms.", "url": "https://huggingface.co/papers/2610.16927", "github": null, "summary_zh": "WeFair通过示范、偏好与验证三阶段的保真度感知人类反馈对齐，改进短视频搜索中的个性化查询改写，减少意图漂移并提升搜索效果。"}, {"id": "2610.37481", "title": "Follow the Gradient: Tracing Safety Degradation Back to Training Data", "upvotes": 25, "summary": "SimpleLoRIF uses gradient alignment to filter instruction data that silently degrades LLM safety, yielding a safer dataset that reduces adversarial success while preserving capabilities.", "url": "https://huggingface.co/papers/2610.37481", "github": null, "summary_zh": "SimpleLoRIF利用梯度对齐筛选出悄悄降低LLM安全性的指令数据，得到更安全的数据集，在降低对抗攻击成功率的同时保留模型能力。"}, {"id": "2610.42149", "title": "Latent Reasoning in Continuous Space for Unified Multimodal Models", "upvotes": 25, "summary": "LARC enables continuous latent reasoning for unified multimodal models, improving image generation quality and enabling test-time scaling without discrete token bottlenecks.", "url": "https://huggingface.co/papers/2610.42149", "github": "https://github.com/rootyJeon/LARC", "summary_zh": "LARC为统一多模态模型引入连续潜空间推理，摆脱离散token瓶颈，提升图像生成质量并支持测试时扩展。"}, {"id": "2610.40339", "title": "Wizard: Manipulate Any World in Real Time via Agentic Control", "upvotes": 24, "summary": "Wizard is an agentic game world model that uses structured motion proxies and adaptive masking to enable real-time, generalizable video generation with precise character control across diverse scenes.", "url": "https://huggingface.co/papers/2610.40339", "github": null, "summary_zh": "Wizard是一个智能体式游戏世界模型，利用结构化运动代理和自适应掩码，实现跨场景、可泛化的实时视频生成，并精确控制角色。"}, {"id": "2610.40373", "title": "HiFOR: Hierarchical Foresight with Action-Guided World Grounding for Vision-Language-Action Model", "upvotes": 24, "summary": "HiFOR improves robotic manipulation by hierarchically predicting future states and retrieving relevant future information to guide action generation.", "url": "https://huggingface.co/papers/2610.40373", "github": null, "summary_zh": "HiFOR通过分层预测未来状态并检索相关未来信息来指导动作生成，从而改进视觉-语言-动作模型的机器人操作。"}, {"id": "2610.35850", "title": "OSWAM: An Effective World Action Model with One-Step Action Generation", "upvotes": 23, "summary": "OSWAM enables real-time, high-quality action generation in autonomous driving and embodied control by initializing diffusion with structured imagination tokens and distilling future-conditioned privileged information into a single denoising step.", "url": "https://huggingface.co/papers/2610.35850", "github": "https://github.com/PolyU-VCLab/OSWAM", "summary_zh": "OSWAM利用结构化想象token初始化扩散过程，并将未来条件的特权信息蒸馏到单步去噪中，实现自动驾驶与具身控制中实时、高质量的动作生成。"}, {"id": "2610.42136", "title": "ReLift: Dense 3D Tracking as Lifted Trajectory Repair", "upvotes": 22, "summary": "ReLift improves dense 3D tracking by repairing and completing lifted trajectories using geometric trajectory refinement without requiring image-based training.", "url": "https://huggingface.co/papers/2610.42136", "github": "https://github.com/ReLift3D/ReLift", "summary_zh": "ReLift将稠密3D跟踪视为提升轨迹的修复问题，通过几何轨迹精化修复并补全轨迹，无需基于图像的训练即可提升跟踪效果。"}, {"id": "2610.37918", "title": "Venus-DefakerOne2: A Vision-Forensics Foundation Model with Broader Coverage", "upvotes": 20, "summary": "Venus-DefakerOne2 is a unified anti-forgery foundation model that extends detection to diverse forgery forms and media types through alternating LoRA and full-parameter tuning and entropy-based test adaptation.", "url": "https://huggingface.co/papers/2610.37918", "github": "https://github.com/inclusionAI/DefakerOne2", "summary_zh": "Venus-DefakerOne2是统一的反伪造基础模型，通过交替LoRA与全参数微调以及基于熵的测试时适应，将检测扩展到多种伪造形式和媒体类型。"}, {"id": "2610.34722", "title": "CEPO: A General Framework for Improving Prompt Optimization in Multi-Agent Systems", "upvotes": 20, "summary": "CEPO improves multi-agent prompt optimization by separating shared coordination from agent-specific execution, boosting performance across benchmarks and scaling efficiently with more agents.", "url": "https://huggingface.co/papers/2610.34722", "github": "https://github.com/mlvlab/CEPO", "summary_zh": "CEPO将共享协调与智能体专属执行分离，改进多智能体系统的提示优化，在多个基准上提升性能，并能随智能体数量高效扩展。"}, {"id": "2610.40914", "title": "No Channels Left Behind: Understanding Diffusion Acceleration through Residual Gates", "upvotes": 18, "summary": "Training acceleration in diffusion transformers is driven by reorganization of AdaLN-Zero residual gates, and a simple radial objective promoting broader gate participation improves generation quality without auxiliary teachers.", "url": "https://huggingface.co/papers/2610.40914", "github": null, "summary_zh": "研究发现扩散Transformer的训练加速源于AdaLN-Zero残差门的重组，提出一种促进更广门参与的径向目标，无需辅助教师即可提升生成质量。"}, {"id": "2610.40799", "title": "CaPtain: A Pipeline for Post-Training Code-as-Policy Robot Agents", "upvotes": 18, "summary": "CaPtain trains small open vision-language models via supervised fine-tuning and multi-turn reinforcement learning with a physical critic to perform robot manipulation through code, achieving strong results without frontier models or vision-language-action backbones.", "url": "https://huggingface.co/papers/2610.40799", "github": "https://github.com/waltstephen/CaPtain", "summary_zh": "CaPtain通过监督微调与带物理评判器的多轮强化学习，训练小型开源视觉语言模型以代码形式执行机器人操作，无需前沿模型或VLA主干即可取得优异效果。"}, {"id": "2610.40636", "title": "Probing Spatial State Representations in Visual Foundation Models", "upvotes": 15, "summary": "Visual foundation models vary in supporting persistent spatial states across structure, persistence, prediction, and action, with readout accuracy not guaranteeing history-based updates or reliable goal-directed progress.", "url": "https://huggingface.co/papers/2610.40636", "github": null, "summary_zh": "研究发现视觉基础模型在结构、持久性、预测和动作四个维度上对持久空间状态的支持各异，读出精度并不保证基于历史的更新或可靠的目标导向进展。"}, {"id": "2610.39301", "title": "Youtu-Parsing-Omni: One Encoder, One Schema, All Modalities", "upvotes": 15, "summary": "Youtu-Parsing-Omni is a unified multi-modal parser that encodes documents, images, audio, and video into structured spatiotemporal records using shared weights and cross-modal fusion, achieving state-of-the-art results across parsing benchmarks through a self-evolving on-policy distillation procedure.", "url": "https://huggingface.co/papers/2610.39301", "github": null, "summary_zh": "Youtu-Parsing-Omni是统一的多模态解析器，用共享权重和跨模态融合将文档、图像、音频和视频编码为结构化时空记录，并通过自进化的在线策略蒸馏在解析基准上达到领先水平。"}, {"id": "2610.40748", "title": "WorldBridge: Bridging Video and Action for Task Generalization in World Action Models", "upvotes": 12, "summary": "WorldBridge improves robot task generalization by combining video prediction with sparse action supervision via separate video and action experts, achieving state-of-the-art results across manipulation benchmarks.", "url": "https://huggingface.co/papers/2610.40748", "github": null, "summary_zh": "WorldBridge通过独立的视频与动作专家，将视频预测与稀疏动作监督结合，提升机器人任务泛化能力，在操作基准上取得领先结果。"}]};

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) return "";
  const W = 64, H = 18, pts = ys.map((y, i) =>
    `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 2 - (y - lo) / (hi - lo) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="近 ${trend.length} 天 star 曲线">
    <title>${esc(trend[0][0])} ★${fmt(ys[0])} → ${esc(trend.at(-1)[0])} ★${fmt(ys.at(-1))}</title>
    <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function card(p) {
  const [owner, repo] = p.name.split("/");
  const flags = p.flags || [], related = p.related || [];
  const flagBadge = (kind, label) => flags.some(f => f.kind === kind) ? `<span class="badge warn">${label}</span>` : "";
  const relLabel = related.every(r => r.reason === "同作者") ? "同作者" : "同类";
  return `<article class="card ${p.suspect ? "suspect" : ""} ${read.has(p.name) ? "read" : ""}">
    <div class="top"><img src="${esc(p.owner_avatar)}&s=56" alt="" loading="lazy">

      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="d">${esc(p.summary_zh || p.summary)}</div>
      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
