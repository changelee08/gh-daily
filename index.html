ingface.co/papers/2611.15777", "github": "https://github.com/holdrain/SO-Arena", "summary_zh": "SO-Arena评测系统一模型的能力谱系与可靠性，发现规模与推理收益因类别而异，高整体准确率不代表决策可靠。"}, {"id": "2611.14815", "title": "BirdDreams: Joint Perspective and BEV Video Generation for a Plausible, Reactive Driving World Model", "upvotes": 51, "summary": "Driving world models aim to simulate how a scene unfolds under different ego actions. This requires plausible motion of surrounding vehicles as well as precise ego-trajectory control. Learning vehicle motion from perspective video alone is challenging because motion is entangled with appearance and ", "url": "https://huggingface.co/papers/2611.14815", "github": null, "summary_zh": "BirdDreams提出联合透视与BEV视频生成的驾驶世界模型，兼顾周围车辆运动合理性与自车轨迹精确控制。"}, {"id": "2610.40394", "title": "Scaling Mathematical Proof Supervision from Structured Textbooks", "upvotes": 49, "summary": "A large-scale corpus of structured proof-supervision records derived from university mathematics textbooks improves language model mathematical reasoning by 16.7 percentage points over a base model when used for fine-tuning.", "url": "https://huggingface.co/papers/2610.40394", "github": null, "summary_zh": "从大学数学教材构建的结构化证明监督语料，用于微调后使语言模型数学推理能力提升16.7个百分点。"}, {"id": "2611.16748", "title": "PhysLoop: Harnessing LLMs' Physics Awareness for Self-Improving Video Generation Models", "upvotes": 46, "summary": "PhysLoop leverages large language models to guide video generation, selection, and correction, enabling physically consistent self-improvement and controllable data construction for video models.", "url": "https://huggingface.co/papers/2611.16748", "github": "https://github.com/DAGroup-PKU/PhysLoop", "summary_zh": "PhysLoop利用大语言模型引导视频生成、筛选与修正，实现物理一致的自我改进与可控数据构建。"}, {"id": "2611.13004", "title": "G-STAR: Group-Scaled Token Capacity for Deeply Compressed Autoregressive Generation", "upvotes": 45, "summary": "Discrete autoregressive models offer a scalable framework for image generation. However, they face a fundamental trade-off: long token sequences preserve representation quality but slow generation, while aggressive spatial compression reduces representation capacity. Based on product quantization, w", "url": "https://huggingface.co/papers/2611.13004", "github": "https://github.com/DAGroup-PKU/G-STAR", "summary_zh": "G-STAR针对离散自回归图像生成中序列长度与压缩率的矛盾，提出分组缩放的token容量方法。"}, {"id": "2611.15131", "title": "Duo: A Reciprocal World Model for Full-Duplex Interaction", "upvotes": 43, "summary": "A reciprocal world model enables real-time full-duplex audiovisual interaction by jointly modeling intent and realization using autoregressive reasoning, synchronized attention, and dual rollout distillation.", "url": "https://huggingface.co/papers/2611.15131", "github": "https://github.com/inclusionAI/Duo", "summary_zh": "Duo提出互惠世界模型，通过联合建模意图与实现及双重展开蒸馏，实现实时全双工音视频交互。"}, {"id": "2611.13410", "title": "SteerDistill: Quantizing LLM Agents via Closed-Loop Teacher Steering", "upvotes": 39, "summary": "Low-bit quantized LLM agents can recover much of their task success through closed-loop guidance from a full-precision teacher, followed by unassisted student training on corrected and reference turns.", "url": "https://huggingface.co/papers/2611.13410", "github": "https://github.com/air-embodied-brain/SteerDistill", "summary_zh": "SteerDistill借助全精度教师的闭环引导，恢复低比特量化LLM智能体的大部分任务成功率。"}, {"id": "2611.15844", "title": "Open Vision Banana: A Fully Open Recipe for Generative Visual Perception", "upvotes": 36, "summary": "Recent work suggests that pretrained image generators encode real-world understanding beyond image synthesis. Vision Banana exploits this by framing vision tasks as conditional image editing. However, its data, weights, code, and implementation details are not public. We present Open Vision Banana (", "url": "https://huggingface.co/papers/2611.15844", "github": "https://github.com/OpenVisionBanana/OpenVisionBanana", "summary_zh": "Open Vision Banana提出完全开放的生成式视觉感知方案，将视觉任务转为条件图像编辑并公开数据与权重。"}, {"id": "2611.17167", "title": "Actor, Judge, or Teacher? Understanding Decision Models in Long-Horizon Agents", "upvotes": 34, "summary": "A decision model that acts poorly can still teach reinforcement learning policies effectively by judging complete action trajectories, improving success on ALFWorld and WebShop.", "url": "https://huggingface.co/papers/2611.17167", "github": "https://github.com/ZJU-REAL/decision-agents", "summary_zh": "决策模型即使行动表现差，也能通过评判完整动作轨迹有效指导强化学习策略，提升ALFWorld和WebShop成功率。"}, {"id": "2611.17060", "title": "Ropedia Xperience 2: A Gold Standard for Scaling Physical AI Environments and Behaviors", "upvotes": 30, "summary": "Large foundation models such as GPT-6 Astra and Claude Fable 5.1 have recently been shown to control robots directly from visual observations. They nevertheless remain brittle on long-horizon, contact-rich tasks in real-world environments. Further progress depends on two complementary resources: dem", "url": "https://huggingface.co/papers/2611.17060", "github": "https://github.com/Ropedia/Ropedia-Xperience-2", "summary_zh": "Ropedia Xperience 2提供面向物理AI环境与行为规模化的金标准资源，以应对机器人在长时程接触任务上的脆弱性。"}, {"id": "2611.05984", "title": "On the Design of Hyper-Connections: Simplification, Stability, and Scalability", "upvotes": 29, "summary": "A systematic study of Hyper-Connections architectures identifies the simpler efficient design SimpleHC, which removes residual mixing and uses shared memory access to match mHC performance while adding minimal training overhead and improving stability.", "url": "https://huggingface.co/papers/2611.05984", "github": "https://github.com/aHapBean/SimpleHC", "summary_zh": "SimpleHC简化超连接架构，去除残差混合并采用共享内存访问，以极小开销匹配mHC性能并提升稳定性。"}, {"id": "2611.17331", "title": "TTB: Test-time Baking for Efficient Rendering of Decoder-only View Synthesis Models", "upvotes": 25, "summary": "By baking global scene information from cross-view attention into a lightweight MLP, Test-Time Baking (TTB) enhances the fidelity of novel-view decoding in Large View Synthesis Models while maintaining the efficiency of Test-Time Training.", "url": "https://huggingface.co/papers/2611.17331", "github": "https://github.com/NVlabs/DVSM", "summary_zh": "TTB将跨视角注意力的全局场景信息烘焙进轻量MLP，在保持测试时训练效率的同时提升新视角解码保真度。"}, {"id": "2608.22237", "title": "Read Less, Solve More: Token-Efficient Sparse Reading of External Content for AI Agents", "upvotes": 22, "summary": "Web-facing AI agents repeatedly access webpages, documents, repositories, and tool responses, yet reading interfaces often expose entire objects when only sparse evidence is needed. This over-reading increases token and latency costs and can dilute relevant evidence. We present SparseRead, a reusabl", "url": "https://huggingface.co/papers/2608.22237", "github": "https://github.com/Liuzedooong/SparseReading", "summary_zh": "SparseRead让网络智能体仅稀疏读取所需证据而非整个对象，降低token与延迟开销并减少证据稀释。"}, {"id": "2611.08318", "title": "Learning the Task or Learning the Verifier? Rethinking Criteria Exposure in Embodied Self-Improvement", "upvotes": 21, "summary": "Exposing benchmark success criteria to self-improving embodied coding agents can raise measured success under those criteria without improving instructed-task completion, and the advantage weakens under slight criteria changes and transfers poorly across tasks, while instruction-faithful criteria better reflect instructed-task performance.", "url": "https://huggingface.co/papers/2611.08318", "github": null, "summary_zh": "向自我改进的具身编码智能体暴露成功标准会虚高指标却不提升指令任务完成度，且标准微调后优势减弱、跨任务迁移差。"}, {"id": "2611.17334", "title": "Unbundling Multimodal Vision Encoding", "upvotes": 16, "summary": "Controlled experiments show that multimodal language models do not need a pretrained vision encoder, but benefit from dedicated vision capacity trained jointly with the backbone and integrated early rather than before fusion.", "url": "https://huggingface.co/papers/2611.17334", "github": null, "summary_zh": "受控实验表明多模态语言模型无需预训练视觉编码器，但受益于与主干联合训练并早期融合的专用视觉容量。"}, {"id": "2611.16217", "title": "WorldDraft: If Code Builds the World, Can Video Models Just Render It?", "upvotes": 16, "summary": "Multimodal coding agents decouple 4D world construction from visual generation, repurposing video models from world generators toward generative renderers. This division of labor raises a fundamental question: if code builds the world, can video models just render it? A reliable generative renderer ", "url": "https://huggingface.co/papers/2611.16217", "github": "https://github.com/KevinHuge/WorldDraft", "summary_zh": "WorldDraft探讨多模态编码智能体构建4D世界后，视频模型能否仅作为生成式渲染器来渲染这些世界。"}, {"id": "2611.16905", "title": "Factored One-sided Adam-Moment for Practical and Scalable SOAP", "upvotes": 14, "summary": "FOAM is a lightweight SOAP variant that uses input-only preconditioning and a factored Adam-moment estimator to match strong second-order and Muon baselines in LLM pre-training while using half the optimizer state and running at Muon-class speed.", "url": "https://huggingface.co/papers/2611.16905", "github": "https://github.com/naver-ai/foam", "summary_zh": "FOAM是轻量级SOAP变体，采用仅输入预条件与分解Adam动量估计，在LLM预训练中匹配强基线且优化器状态减半。"}, {"id": "2611.10439", "title": "Who Remembers What? Multi-Granularity Memory Extraction for Multi-User, Multi-Agent Interaction", "upvotes": 13, "summary": "MixUA distills lessons from independent user-agent trajectories and assigns them to appropriate scopes to balance cross-user and cross-agent learning with privacy, evaluated by CrossLearnBench.", "url": "https://huggingface.co/papers/2611.10439", "github": null, "summary_zh": "MixUA从独立用户-智能体轨迹中提炼经验并分配到合适作用域，在跨用户跨智能体学习与隐私之间取得平衡。"}, {"id": "2611.16517", "title": "UniSpark: Exploring Hybrid Attention for Multimodal Understanding and Generation", "upvotes": 13, "summary": "We present UniSpark-9B, a unified multimodal model that investigates hybrid attention for visual understanding and generation. Built on a Mixture-of-Transformer-Experts backbone with approximately 9B parameters in each branch, UniSpark combines full attention for explicit token interactions with Gat", "url": "https://huggingface.co/papers/2611.16517", "github": null, "summary_zh": "UniSpark-9B探索混合注意力在多模态理解与生成中的应用，基于混合专家Transformer主干构建统一模型。"}, {"id": "2611.08286", "title": "Interactive Visual Gym: Evaluating Visual Interaction Models with Simulated Users in Interactive Worlds", "upvotes": 13, "summary": "Interactive Visual Gym enables closed-loop evaluation and training of visual interaction models by jointly simulating task environments and human users, exposing limitations in state-of-the-art VLMs and improving performance through closed-loop training.", "url": "https://huggingface.co/papers/2611.08286", "github": "https://github.com/SalesforceAIResearch/Interactive-Visual-Gym", "summary_zh": "Interactive Visual Gym通过同时模拟任务环境与人类用户，实现视觉交互模型的闭环评测与训练并提升性能。"}]};
const ARCHIVE = ["2026-11-16", "2026-11-15", "2026-11-14", "2026-11-13", "2026-11-12", "2026-11-11", "2026-11-10", "2026-11-09", "2026-11-06", "2026-11-05", "2026-11-04", "2026-11-03", "2026-11-02", "2026-11-01", "2026-10-30"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
let D, cat = "全部";

// 收藏 / 已读：存在本浏览器
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("ghd:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ghd:" + k, JSON.stringify(v)); } catch {} },
};
let favs = store.get("favs", {}), read = new Set(store.get("read", []));
const saveRead = () => store.set("read", [...read].slice(-3000));

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) return "";
  const W = 64, H = 18, pts = ys.map((y, i) =>
    `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 2 - (y - lo) / (hi - lo) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="近 ${trend.length} 天 star 曲线">
    <title>${esc(trend[0][0])} ★${fmt(ys[0])} → ${esc(trend.at(-1)[0])} ★${fmt(ys.at(-1))}</title>
    <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function card(p) {
  const [owner, repo] = p.name.split("/");
  const flags = p.flags || [], related = p.related || [];
  const flagBadge = (kind, label) => flags.some(f => f.kind === kind) ? `<span class="badge warn">${label}</span>` : "";
  const relLabel = related.every(r => r.reason === "同作者") ? "同作者" : "同类";
  return `<article class="card ${p.suspect ? "suspect" : ""} ${read.has(p.name) ? "read" : ""}">
    <div class="top"><img src="${esc(p.owner_avatar)}&s=56" alt="" loading="lazy">
      <div class="name"><a class="main" href="${esc(p.url)}" target="_blank" rel="noopener" data-name="${esc(p.name)}"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a></div>
      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="d">${esc(p.summary_zh || p.summary)}</div>
      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
