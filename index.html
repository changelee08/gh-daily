ical sequences and represents spectra as ordered ", "url": "https://huggingface.co/papers/2611.21072", "github": "https://github.com/InternLM/Sage-S2.1-Flash", "summary_zh": "提出320B混合专家通用模型Sage Flash，用于科学推理与交互式行动，并为分子图和生物序列设计专用编码器。"}, {"id": "2611.21003", "title": "K2-Horizon: A Frontier Fleet of Open Source Language Models", "upvotes": 72, "summary": "We present K2-Horizon, a fleet of six fully open language models, from a 0.9B dense model to a 375B-A23B MoE, built for general-purpose reasoning and agentic work across math and science, software engineering, deep research, office automation, and beyond. The models lead or are competitive with stro", "url": "https://huggingface.co/papers/2611.21003", "github": null, "summary_zh": "发布K2-Horizon系列六个全开源语言模型（0.9B至375B MoE），面向推理与智能体任务，表现领先或具竞争力。"}, {"id": "2611.19937", "title": "AllocFlow: End-to-End Portfolio Trading Action Generation from Raw Market Data", "upvotes": 67, "summary": "An end-to-end flow-matching framework generates joint portfolio allocations from raw multi-asset market histories via a cross-asset flow Transformer and a two-stage imitation and group-relative reinforcement learning procedure, improving risk-adjusted returns on cryptocurrency perpetual futures.", "url": "https://huggingface.co/papers/2611.19937", "github": "https://github.com/allocflow/AllocFlow", "summary_zh": "提出AllocFlow，直接从原始行情生成组合配置，结合模仿与强化学习，提升加密永续合约的风险调整收益。"}, {"id": "2611.21218", "title": "InclusionMed: Benchmarking AI for Inclusive Healthcare", "upvotes": 62, "summary": "InclusionMed is an open medical AI evaluation initiative that audits and reproduces benchmarks across healthcare roles and capabilities, revealing that model rankings and inference costs vary by context and motivating broader, context-specific evaluation.", "url": "https://huggingface.co/papers/2611.21218", "github": "https://github.com/panuvi/inclusionmed", "summary_zh": "提出InclusionMed开源医疗AI评测项目，复现审计各类医疗基准，发现模型排名与成本随场景变化，呼吁情境化评估。"}, {"id": "2611.07222", "title": "SPILLWAY: Separating Target Admission from Sanitization to Defend Tool-Using Agents against Prompt Injection", "upvotes": 55, "summary": "Tool-using agents act on email, files, and payments, so an instruction hidden in a web page or a shared document can make an agent send data or money to an attacker. Many runtime defenses put a language model on the decision that lets an action through, so the decision depends on a model that may re", "url": "https://huggingface.co/papers/2611.07222", "github": "https://github.com/saintmachines/spillway", "summary_zh": "提出SPILLWAY，将目标准入与内容净化分开，使放行决策不依赖可能被注入的语言模型，以防御工具调用智能体的提示注入。"}, {"id": "2611.20218", "title": "SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations", "upvotes": 44, "summary": "A benchmark of realistic software engineering assignments reveals that current coding agents struggle to track requirements from clarification through implementation, verification, and handoff, completing few tasks despite partial test success.", "url": "https://huggingface.co/papers/2611.20218", "github": "https://github.com/TokenWave-AI/swe-cowork-bench", "summary_zh": "提出SWE-CoWork基准，评测编码智能体作为组织内数字员工的表现，发现其难以跟踪需求从澄清到交付的全过程。"}, {"id": "2611.21607", "title": "ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters", "upvotes": 41, "summary": "Frontier Vision-Language Models (VLMs) such as GPT-6 Astra have demonstrated remarkable capabilities in robot control, suggesting that broad pretraining provides knowledge valuable for physical action. Yet most Vision-Language-Action (VLA) policies still rely on much smaller VLM backbones, leaving t", "url": "https://huggingface.co/papers/2611.21607", "github": null, "summary_zh": "提出ScaleVLA，将视觉-语言-动作模型扩展到5520亿参数，探索更大VLM骨干对机器人控制的价值。"}, {"id": "2611.17834", "title": "PaperCritic: Training AI Reviewers to Assess the Soundness of Papers", "upvotes": 28, "summary": "An AI reviewer trained by reinforcement learning to jointly maximize precision and recall of soundness review points outperforms frontier models and other training methods and transfers to other review domains.", "url": "https://huggingface.co/papers/2611.17834", "github": null, "summary_zh": "用强化学习训练AI审稿人评估论文可靠性，效果优于前沿模型，且可迁移到其他审稿领域。"}, {"id": "2611.20254", "title": "VoxMel TTS Technical Report", "upvotes": 22, "summary": "VoxMel is a tokenizer-free autoregressive TTS framework that uses an invertible two-axis Haar transform to decompose mel spectrograms into Coarse-Mel and residual tiers, enabling stable high-fidelity generation with strong recognition and speaker-similarity results.", "url": "https://huggingface.co/papers/2611.20254", "github": "https://github.com/VoxDance-Lab/VoxMel", "summary_zh": "提出VoxMel语音合成框架，无需分词器，用可逆双轴Haar变换将梅尔谱分解为粗层与残差层，实现稳定高保真生成。"}, {"id": "2611.20882", "title": "Accelerate Bench: Evaluating Agents for Application-Level Program Optimization", "upvotes": 16, "summary": "Application optimization requires coding agents to discover useful changes and coordinate them across a complete program while preserving the required computation. We introduce Accelerate Bench, a benchmark of 32 CPU optimization tasks adapted from scientific applications and supercomputing competit", "url": "https://huggingface.co/papers/2611.20882", "github": "https://github.com/AdAstraAbyssoque/accelerate-bench", "summary_zh": "提出Accelerate Bench基准，含32个源自科学应用与超算竞赛的CPU优化任务，评测智能体对完整程序的优化能力。"}, {"id": "2611.17110", "title": "SALA: Semantically Aligned Latent Actions Enable Dual-Axis Scaling of Embodied Foundation Models", "upvotes": 13, "summary": "SALA aligns latent actions across human and robot videos by using language-based semantic similarities to form a shared latent action space that supervises embodied foundation model training and improves robot task performance.", "url": "https://huggingface.co/papers/2611.17110", "github": null, "summary_zh": "提出SALA，借助语言语义相似度对齐人类与机器人视频的潜在动作，提升具身基础模型的机器人任务表现。"}, {"id": "2611.20986", "title": "Calpha: Toward Native Biomolecular Intelligence in a General-Purpose Language Model", "upvotes": 11, "summary": "A large language model can output single-chain protein structures from its internal residue states by invoking a pretrained structure head, with reduced long-chain accuracy and MMLU-Pro accuracy in the reported tests.", "url": "https://huggingface.co/papers/2611.20986", "github": "https://github.com/yliust/Calpha", "summary_zh": "探索让通用大语言模型从内部残基状态输出单链蛋白质结构，报告显示长链精度下降，MMLU-Pro准确率也有所降低。"}, {"id": "2611.21339", "title": "MovieRoll: A Systematic Framework for Rolling Out Long-Form Videos", "upvotes": 10, "summary": "Streaming video generation must sustain quality beyond the training horizon while handling self-generated history and growing cache costs. To address these challenges, we present MovieRoll, a base-to-distilled framework that connects streaming fine-tuning, long-rollout distillation, and long-horizon", "url": "https://huggingface.co/papers/2611.21339", "github": "https://github.com/Tencent-Hunyuan/MovieRoll", "summary_zh": "提出MovieRoll框架，用于长视频流式生成，连接流式微调与长程蒸馏，保证超出训练时长后的生成质量。"}, {"id": "2611.14487", "title": "Re-Search: Dissecting LLM Ideation Through a Two-Player Questioning Game", "upvotes": 10, "summary": "A Twenty Questions-style benchmark for research ideation shows that large language models make most progress early, can recognize good ideas or questions but often cannot generate them, and may benefit from externally sourced candidates in automated research systems.", "url": "https://huggingface.co/papers/2611.14487", "github": null, "summary_zh": "提出Re-Search，用二十问式双人游戏评测LLM的研究构思能力，发现模型早期进步最大，善于识别好想法却难以生成。"}, {"id": "2611.20404", "title": "Latent Feedback Is a Compute and Data Amplifier", "upvotes": 6, "summary": "Latent feedback, which feeds each token's top-layer state into the next token's input, improves compute and data efficiency over standard Transformers, especially when unique data is abundant relative to model size.", "url": "https://huggingface.co/papers/2611.20404", "github": "https://github.com/ifm-ai/LoRM", "summary_zh": "提出潜在反馈，将顶层状态馈入下一token，相比标准Transformer提升算力与数据效率，独特数据充足时效果更明显。"}, {"id": "2611.08977", "title": "Energy-Based Reasoners: Your Recurrent Reasoner Should Be an Energy-Based Model", "upvotes": 5, "summary": "Energy-Based Reasoners guide looped latent reasoning by learning an energy function whose gradient refines states and signals when to stop, with exploration-based training improving performance and efficiency.", "url": "https://huggingface.co/papers/2611.08977", "github": "https://github.com/wwillchen/ebr", "summary_zh": "提出能量基推理器，用学到的能量函数引导循环潜在推理，梯度用于精炼状态并决定何时停止，探索式训练提升性能与效率。"}, {"id": "2611.14960", "title": "Termination Lag: Coding Agents Solve Early but Stop Late", "upvotes": 5, "summary": "Coding agents often find correct patches early but continue working, sometimes undoing correct solutions, with termination lag varying by model and benchmark.", "url": "https://huggingface.co/papers/2611.14960", "github": "https://github.com/musacim/termination-lag", "summary_zh": "研究发现编码智能体往往较早找到正确补丁，却继续运行，甚至撤销正确方案，即终止滞后现象，且因模型与基准而异。"}, {"id": "2611.18919", "title": "Correcting Persistent Failures in Point-Cloud Grasping Policies using Human Demonstrations in Virtual Reality", "upvotes": 5, "summary": "A human-in-the-loop failure-mining pipeline turns persistently unsolved grasps of a reinforcement-learning point-cloud policy into virtual-reality human demonstrations, improving hard-case success without reducing generalization to unseen objects.", "url": "https://huggingface.co/papers/2611.18919", "github": null, "summary_zh": "提出人在回路的失败挖掘流程，将强化学习点云抓取策略持续失败的案例转为VR人类示范，提升困难场景成功率且不损泛化。"}, {"id": "2611.17933", "title": "OutfitterBench: Evaluating LLM Agents on Long-Horizon Resource Allocation and Commitment Coordination", "upvotes": 5, "summary": "OutfitterBench evaluates LLM agents managing a 200-day outdoor-equipment rental business under fixed capital and uncertain demand, revealing limitations in sustaining feasible commitments and reallocating resources.", "url": "https://huggingface.co/papers/2611.17933", "github": "https://github.com/adminblackjack/OutfitterBench", "summary_zh": "提出OutfitterBench，评测LLM智能体在200天户外装备租赁经营中的长程资源分配与承诺协调，发现其难以维持可行承诺。"}, {"id": "2611.19537", "title": "Continuation-Guided LLM Evolution of Program Policies and Goal Compilers in Craftax", "upvotes": 5, "summary": "A framework uses coding agents and a feedback cascade to synthesize code-based policies that achieve long-horizon success and can be factored into a reusable goal compiler for zero-shot transfer to new tasks.", "url": "https://huggingface.co/papers/2611.19537", "github": "https://github.com/vicgalle/craftax-program-policies", "summary_zh": "提出用编码智能体与反馈级联合成程序化策略及可复用目标编译器的框架，在Craftax中实现长程成功并可零样本迁移。"}]};

  const flagBadge = (kind, label) => flags.some(f => f.kind === kind) ? `<span class="badge warn">${label}</span>` : "";
  const relLabel = related.every(r => r.reason === "同作者") ? "同作者" : "同类";
  return `<article class="card ${p.suspect ? "suspect" : ""} ${read.has(p.name) ? "read" : ""}">
    <div class="top"><img src="${esc(p.owner_avatar)}&s=56" alt="" loading="lazy">
      <div class="name"><a class="main" href="${esc(p.url)}" target="_blank" rel="noopener" data-name="${esc(p.name)}"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a></div>
      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="d">${esc(p.summary_zh || p.summary)}</div>
      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
