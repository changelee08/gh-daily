}, {"title": "Olumino, a Markdown notes and spaced repetition app", "url": "https://olumino.app", "hn_url": "https://news.ycombinator.com/item?id=50651099", "points": 72, "comments": 36, "github": null, "title_zh": "Olumino：一款 Markdown 笔记与间隔重复应用"}, {"title": "Turned a $5 AliExpress clock into a desk Clawd pet(+usage)", "url": "https://github.com/click6067-ship-it/token-tv", "hn_url": "https://news.ycombinator.com/item?id=50642300", "points": 55, "comments": 7, "github": "click6067-ship-it/token-tv", "title_zh": "把 5 美元的速卖通时钟改造成桌面 Clawd 宠物（附用法）"}, {"title": "I wrote an entire Vim manual over 4 years", "url": "http://themouseless.dev/vim/", "hn_url": "https://news.ycombinator.com/item?id=50655868", "points": 52, "comments": 18, "github": null, "title_zh": "我用四年时间写了一整本 Vim 手册"}, {"title": "Sliding-panes React UI library (inspired by WebOS Enyo)", "url": "https://vcarl.com/sashay/", "hn_url": "https://news.ycombinator.com/item?id=50637936", "points": 38, "comments": 8, "github": null, "title_zh": "滑动面板式 React UI 库（灵感来自 WebOS Enyo）"}, {"title": "SimDrop – Running iOS simulators in the macOS Finder sidebar", "url": "https://github.com/rxliuli/sim-drop", "hn_url": "https://news.ycombinator.com/item?id=50657070", "points": 37, "comments": 8, "github": "rxliuli/sim-drop", "title_zh": "SimDrop：在 macOS 访达侧边栏中运行 iOS 模拟器"}, {"title": "Brickie – Deploy sandboxes in your own AWS account", "url": "https://github.com/hatchet-dev/brickie", "hn_url": "https://news.ycombinator.com/item?id=50629936", "points": 35, "comments": 13, "github": "hatchet-dev/brickie", "title_zh": "Brickie：在你自己的 AWS 账户中部署沙箱环境"}], "papers": [{"id": "2611.34849", "title": "Real2SimLab: A Unified Platform for Real-to-Simulation Transfer", "upvotes": 103, "summary": "Real-to-simulation transfer, which builds simulations from real-world observations, has long been studied in research and industry. Recently, coding agents have become capable of generating simulation programs from video recordings, and several benchmarks have been proposed to evaluate them. However", "url": "https://huggingface.co/papers/2611.34849", "github": "https://github.com/Real2SimHub/Real2SimLab", "summary_zh": "提出统一的真实到仿真迁移平台，用于评测编码智能体从视频生成仿真程序的能力。"}, {"id": "2611.34575", "title": "Sage-Med: Scaling Medical Multimodal Intelligence", "upvotes": 85, "summary": "Establishing effective scaling laws for medical multimodal large language models (MLLMs) remains a persistent and fundamental challenge. Our systematic evaluation shows that existing medical MLLMs tend to underperform frontier general-purpose MLLMs across a range of medical tasks, while scaling mode", "url": "https://huggingface.co/papers/2611.34575", "github": "https://github.com/Sage-Med/Sage-Med-Preview", "summary_zh": "探索医学多模态大模型的缩放规律，旨在缩小其与通用前沿模型在医学任务上的差距。"}, {"id": "2611.34923", "title": "Mixture-of-Loops Transformer", "upvotes": 60, "summary": "A Mixture-of-Loops Transformer reuses key-value memory across loops and depths, and its U-shaped variant improves pretraining efficiency and inference latency.", "url": "https://huggingface.co/papers/2611.34923", "github": "https://github.com/hustvl/MoLT", "summary_zh": "提出复用KV记忆的混合循环Transformer，其U形变体提升了预训练效率和推理延迟。"}, {"id": "2611.34237", "title": "VibeVideoAgent: Closing the Perceptual Loop for Code-Driven Video Generation", "upvotes": 54, "summary": "Code-driven video generation asks a coding agent to write and run rendering programs. This gives exact control over typography, data visualizations, synchronized audio, and multi-shot scenes, and it leaves an editable project behind. A program that exits cleanly can still render overlapping labels, ", "url": "https://huggingface.co/papers/2611.34237", "github": "https://github.com/Kling-Keye/VibeVideoAgent", "summary_zh": "为代码驱动视频生成引入感知闭环，让智能体能发现并修正渲染中如标签重叠等视觉问题。"}, {"id": "2611.34941", "title": "Improving and Expanding Video Editing Capabilities Without Videos", "upvotes": 44, "summary": "Image-to-Video Transfer improves pretrained video editors by training them as image editors on single images, enabling new video editing tasks and state-of-the-art results on OpenVE-Bench and OpenVE++.", "url": "https://huggingface.co/papers/2611.34941", "github": "https://github.com/HorizonWind2004/i2v-transfer", "summary_zh": "仅用单张图像把视频编辑模型训练成图像编辑器，无需视频数据即可支持新的编辑任务。"}, {"id": "2611.34420", "title": "DocSEAM: Bidirectional Cross-Page Encoding for Multi-Page Document Understanding", "upvotes": 26, "summary": "DocSEAM is a lightweight module between a pretrained vision encoder and language model that enriches page visual tokens with neighboring-page context via center-anchored masked self-attention, improving multi-page document VQA and reducing boundary sensitivity.", "url": "https://huggingface.co/papers/2611.34420", "github": "https://github.com/mossbee/DocSEAM", "summary_zh": "提出轻量模块，通过中心锚定掩码自注意力融合相邻页上下文，提升多页文档视觉问答效果。"}, {"id": "2611.31237", "title": "Let Vision-Language Models Generate Images through Their Representations", "upvotes": 24, "summary": "Integral converts a pretrained vision-language model into a unified multimodal model by constructing a shared visual representation space, preserving understanding while enabling strong visual generation.", "url": "https://huggingface.co/papers/2611.31237", "github": "https://github.com/the-jb/integral", "summary_zh": "将预训练视觉语言模型改造成统一多模态模型，构建共享视觉表示空间，兼顾理解与生成。"}, {"id": "2611.34811", "title": "HOG-WAM: Improving Visual Robustness through Future Gradient Prediction", "upvotes": 22, "summary": "HOG-WAM improves visually robust control in world-action models by adding future Histograms of Oriented Gradients as auxiliary structural supervision through a training-only HOG diffusion transformer, yielding higher success under observation corruptions while preserving the original RGB-to-action inference architecture.", "url": "https://huggingface.co/papers/2611.34811", "github": "https://github.com/iPPLab/HOG-WAM", "summary_zh": "在世界动作模型中加入未来方向梯度直方图的辅助监督，提升视觉干扰下的机器人控制鲁棒性。"}, {"id": "2611.34466", "title": "EgoUseBench: Benchmarking Computer-Use Agents under Evolving First-Person Contexts", "upvotes": 19, "summary": "AI wearables, such as smart glasses, extend the context available to agents beyond digital environments to users' physical surroundings. With these devices, computer tasks can originate from users' ongoing activities rather than solely from explicit instructions. Through first-person observations, a", "url": "https://huggingface.co/papers/2611.34466", "github": "https://github.com/YurunChen/EgoUseBench", "summary_zh": "面向智能眼镜等第一视角场景，评测计算机使用智能体在用户日常活动中的任务表现。"}, {"id": "2611.34929", "title": "High-Fidelity Image Matting with Pixel-Space Diffusion Transformers", "upvotes": 19, "summary": "Diffusion models have shown strong potential for image matting by transferring generative priors learned from large-scale pretraining. However, existing approaches largely rely on latent diffusion models, whose compressed representations and VAE-based reconstruction introduce a mismatch with the hig", "url": "https://huggingface.co/papers/2611.34929", "github": "https://github.com/White-YC/pixelmatte", "summary_zh": "基于像素空间扩散Transformer进行高保真图像抠图，避免潜在扩散模型的VAE重建失真。"}, {"id": "2611.33579", "title": "DexEngine: Scaling Human Demonstrations into Physically Executable Whole-Robot Data", "upvotes": 18, "summary": "A growing body of recent work addresses the retargeting of human hand-object demonstrations to robotic hands. To train whole-robot policies, however, the retargeted motions must be kinematically feasible and physically executable, and be produced efficiently at scale. We present DexEngine, a simulat", "url": "https://huggingface.co/papers/2611.33579", "github": "https://github.com/wongyun-yu/DexEngine", "summary_zh": "将人手操作示范规模化转换为可物理执行的整机机器人数据，用于训练全机器人策略。"}, {"id": "2611.33457", "title": "Playfulness as Feedback for Agentic Game Development", "upvotes": 18, "summary": "Play2Evolve uses AI agents to iteratively playtest, diagnose, and improve generated games through initialization, refinement, and evolution stages, enhancing functionality, visuals, and gameplay quality.", "url": "https://huggingface.co/papers/2611.33457", "github": "https://github.com/showlab/Play2Evolve", "summary_zh": "利用AI智能体迭代试玩、诊断并改进生成的游戏，提升功能、视觉和玩法质量。"}, {"id": "2611.34347", "title": "AIRIS: Benchmarking Social Embodied Intelligence in Egocentric Streaming Videos", "upvotes": 17, "summary": "Embodied agents operating around people must not only recognize social cues, but also decide when the available evidence is sufficient, whether to intervene, and how to respond without violating social norms. Existing benchmarks typically evaluate these abilities in isolation or with access to compl", "url": "https://huggingface.co/papers/2611.34347", "github": "https://github.com/AIRIS-bench/AIRIS", "summary_zh": "构建第一视角流式视频的社交具身智能基准，考察智能体何时证据充分及如何合适地回应。"}, {"id": "2611.34128", "title": "FoundSurface: Feedforward Ray-Based 3D Scene Surface Reconstruction from Unposed Images", "upvotes": 17, "summary": "A generalizable pipeline reconstructs continuous, high-fidelity 3D surfaces from unposed images by integrating pointmap and ray-based representations, achieving strong zero-shot generalization.", "url": "https://huggingface.co/papers/2611.34128", "github": "https://github.com/vLAR-group/FoundSurface", "summary_zh": "从无位姿图像前馈重建连续高保真3D场景表面，融合点图与射线表示，具备零样本泛化能力。"}, {"id": "2611.30965", "title": "Beyond Self-Consistency: Recursive Self-Improvement at Test Time", "upvotes": 15, "summary": "A label-free test-time framework, TT-RSI, improves large language models by repeatedly re-solving questions with prior solutions and distilling refinements into model weights, outperforming self-consistency methods under the same test-time scaling budget.", "url": "https://huggingface.co/papers/2611.30965", "github": "https://github.com/uanu2002/TT-RSI", "summary_zh": "提出无标签测试时框架TT-RSI，反复重解题并将改进蒸馏进权重，优于自一致性方法。"}, {"id": "2611.33636", "title": "What Is Redundant at High Resolution? Efficient Attention and Feed-Forward Design for All-in-One Image Restoration", "upvotes": 14, "summary": "A multi-scale image restoration network reduces redundant computation in attention and feed-forward layers to achieve state-of-the-art restoration with faster inference.", "url": "https://huggingface.co/papers/2611.33636", "github": "https://github.com/dslisleedh/HiGLR", "summary_zh": "设计多尺度图像复原网络，减少注意力与前馈层中的冗余计算，实现更快推理和领先复原效果。"}, {"id": "2611.33925", "title": "Beyond the Happy Path: Generalizing Robot World Models from Simulated Failures", "upvotes": 13, "summary": "Training world models on simulated manipulation failures with interaction alignment and surface correspondence reduces object trajectory and action-outcome prediction errors, including on unseen objects and real data.", "url": "https://huggingface.co/papers/2611.33925", "github": "https://github.com/aim-uofa/WorldReforge", "summary_zh": "用仿真中的操作失败训练机器人世界模型，降低对未见物体的轨迹与动作结果预测误差。"}, {"id": "2611.33922", "title": "iMFPO: Improving Mean Flow Policy Optimization with Drift-Aware Velocity Alignment for Embodied Control", "upvotes": 9, "summary": "iMFPO enables efficient one-step action generation for embodied control by decoupling velocity learning and aligning drift-aware velocities during reward-driven policy optimization.", "url": "https://huggingface.co/papers/2611.33922", "github": "https://github.com/AIGeeksGroup/iMFPO", "summary_zh": "通过解耦速度学习并对齐漂移感知速度，实现具身控制中高效的单步动作生成。"}, {"id": "2611.34675", "title": "RoboEvo^2: Recursive Robot Self-Improvement via Harness-Policy Co-Evolution", "upvotes": 9, "summary": "RoboEvo$^2$ recursively co-evolves a coding-agent harness and a vision-language-action policy, using policy failures to discover reusable skills and preference distillation to improve motor control, yielding large success gains without extra human demonstrations.", "url": "https://huggingface.co/papers/2611.34675", "github": "https://github.com/kaiknower/RoboEvo2", "summary_zh": "让编码智能体框架与视觉语言动作策略递归协同进化，无需额外人类示范即可大幅提升成功率。"}, {"id": "2611.34147", "title": "Letting Models Manage Their Own Context: Where We Stand", "upvotes": 7, "summary": "Model-driven context management through a context API improves accuracy and token efficiency over harness-triggered compaction, while reusing KV caches after edits reduces prefill compute.", "url": "https://huggingface.co/papers/2611.34147", "github": "https://github.com/nvidia-nemo/labs-OO-Agents", "summary_zh": "提出模型自主管理上下文的接口，比框架触发的压缩更准确、更省token，编辑后复用KV缓存降低计算。"}]};
const ARCHIVE = ["2026-11-27", "2026-11-26", "2026-11-25", "2026-11-24", "2026-11-23", "2026-11-22", "2026-11-21", "2026-11-20", "2026-11-19", "2026-11-18", "2026-11-17", "2026-11-16", "2026-11-15", "2026-11-14", "2026-11-13", "2026-11-12", "2026-11-11", "2026-11-10", "2026-11-09", "2026-11-06", "2026-11-05", "2026-11-04", "2026-11-03", "2026-11-02", "2026-11-01", "2026-10-30"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
let D, cat = "全部";

// 收藏 / 已读：存在本浏览器
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("ghd:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ghd:" + k, JSON.stringify(v)); } catch {} },
};
let favs = store.get("favs", {}), read = new Set(store.get("read", []));
const saveRead = () => store.set("read", [...read].slice(-3000));

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) return "";
  const W = 64, H = 18, pts = ys.map((y, i) =>
    `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 2 - (y - lo) / (hi - lo) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="近 ${trend.length} 天 star 曲线">
    <title>${esc(trend[0][0])} ★${fmt(ys[0])} → ${esc(trend.at(-1)[0])} ★${fmt(ys.at(-1))}</title>
    <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function card(p) {
  const [owner, repo] = p.name.split("/");
  const flags = p.flags || [], related = p.related || [];
  const flagBadge = (kind, label) => flags.some(f => f.kind === kind) ? `<span class="badge warn">${label}</span>` : "";
  const relLabel = related.every(r => r.reason === "同作者") ? "同作者" : "同类";
  return `<article class="card ${p.suspect ? "suspect" : ""} ${read.has(p.name) ? "read" : ""}">
    <div class="top"><img src="${esc(p.owner_avatar)}&s=56" alt="" loading="lazy">
      <div class="name"><a class="main" href="${esc(p.url)}" target="_blank" rel="noopener" data-name="${esc(p.name)}"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a></div>
      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="d">${esc(p.summary_zh || p.summary)}</div>
      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
