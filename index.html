tor.com/item?id=50599762", "points": 357, "comments": 89, "github": "gulivan/worker755", "title_zh": "我做了一款游戏，你扮演 LLM 的子代理"}, {"title": "Zero C# – C# without a runtime or GC", "url": "https://onurgumus.github.io/zero-csharp/index.html", "hn_url": "https://news.ycombinator.com/item?id=50590279", "points": 178, "comments": 136, "github": null, "title_zh": "Zero C#：没有运行时和 GC 的 C#"}, {"title": "The Riemann Proof Handbook", "url": "https://github.com/tamnd/riemann-handbook", "hn_url": "https://news.ycombinator.com/item?id=50596664", "points": 89, "comments": 60, "github": "tamnd/riemann-handbook", "title_zh": "黎曼证明手册"}, {"title": "I made a PS1 style racing game", "url": "https://outpostracer.com", "hn_url": "https://news.ycombinator.com/item?id=50589184", "points": 48, "comments": 38, "github": null, "title_zh": "我做了一款 PS1 风格的赛车游戏"}, {"title": "Hermit CRM – Free open-source CRM for solopreneurs", "url": "https://hermitcrm.io/", "hn_url": "https://news.ycombinator.com/item?id=50609708", "points": 39, "comments": 2, "github": null, "title_zh": "Hermit CRM：面向独立创业者的免费开源 CRM"}], "papers": [{"id": "2611.27193", "title": "cmHC: Balancing Stream Mixing in Hyper-Connections via Geometric Contraction", "upvotes": 92, "summary": "Constraining residual stream mixing within the Birkhoff polytope via geometric contraction improves stability and scalability of hyper-connections in large-scale dense and mixture-of-experts model pretraining.", "url": "https://huggingface.co/papers/2611.27193", "github": "https://github.com/Newiz430/cmHC", "summary_zh": "用几何收缩约束超连接中残差流的混合，提升大规模稠密与MoE模型预训练的稳定性和可扩展性。"}, {"id": "2611.27963", "title": "Non-penetrating World Models", "upvotes": 54, "summary": "A benchmark and lightweight framework leverage hidden states from frozen diffusion transformers to detect and prevent object penetration in interactive video world models, reducing physical violations and generalizing zero-shot.", "url": "https://huggingface.co/papers/2611.27963", "github": "https://github.com/yuhangdai427/NoPeWorld", "summary_zh": "利用冻结扩散Transformer的隐藏状态检测并阻止交互式视频世界模型中的物体穿透，减少物理违规且可零样本泛化。"}, {"id": "2611.24636", "title": "Clover-35B-A3B-Preview Technical Report", "upvotes": 36, "summary": "We introduce Clover-35B-A3B-Preview (Clover), a mixture-of-experts diffusion language model with 35 billion total parameters and 3 billion activated parameters, supporting thinking-mode generation. Clover adapts Gated Delta Networks to block diffusion by combining recurrent memory of previously gene", "url": "https://huggingface.co/papers/2611.24636", "github": "https://github.com/DiffuSpace/Clover-35B-A3B-Preview", "summary_zh": "提出Clover混合专家扩散语言模型（总参35B、激活3B），将门控Delta网络用于块扩散并支持思考模式。"}, {"id": "2611.26590", "title": "Probing the \"Conscious\" Mind: Selective Access and Global Workspace in Vision-Language Models", "upvotes": 36, "summary": "Vision-language models (VLMs) integrate visual and textual information, but their outputs do not reveal internal concept representations. Global workspace theory (GWT) proposes that information is selected from parallel brain processes, integrated in a shared workspace, and made available to special", "url": "https://huggingface.co/papers/2611.26590", "github": null, "summary_zh": "借全局工作空间理论，探究视觉语言模型内部概念表征的选择性访问与整合机制。"}, {"id": "2611.26954", "title": "Learning Video Foresight Reasoning from Unlabeled Videos via On-Policy Self-Distillation", "upvotes": 28, "summary": "Future-OPSD trains vision-language models via on-policy self-distillation and a contrastive privilege advantage derived from a foresight score, improving video foresight prediction and planning without extra annotations or LLM supervision.", "url": "https://huggingface.co/papers/2611.26954", "github": "https://github.com/Jingchensun/future-opsd", "summary_zh": "提出Future-OPSD，通过在线策略自蒸馏和基于前瞻分数的对比特权优势，无需额外标注即可提升视频前瞻预测与规划。"}, {"id": "2611.26107", "title": "HiUni: Harmonizing Understanding and Generation in Shared Visual Space", "upvotes": 25, "summary": "Unified multimodal models aim to support visual understanding and generation within a single framework. However, prevailing approaches often separate their visual representations or backbone computation to accommodate the different requirements of these two tasks, which limits the degree of unificat", "url": "https://huggingface.co/papers/2611.26107", "github": "https://github.com/ernie-research/HiUni", "summary_zh": "提出HiUni，在共享视觉空间中统一多模态模型的理解与生成，避免为两类任务分离视觉表征或主干计算。"}, {"id": "2611.26073", "title": "AltRA-Test: An Alternative Annotator Test for LLM Judges Without Shared Annotators", "upvotes": 24, "summary": "A statistical test, AltRA-Test, determines when large language models can replace human annotators by comparing inter-annotator agreement in resampled mixed human-LLM panels, and evaluations show it often requires about 100 items and makes better replacement decisions than baselines.", "url": "https://huggingface.co/papers/2611.26073", "github": null, "summary_zh": "提出AltRA-Test统计检验，通过重采样人机混合评审小组的标注者一致性，判断LLM能否替代人类标注者。"}, {"id": "2611.25773", "title": "Duopra: From Full-Duplex Conversation to Full-Duplex Agency", "upvotes": 22, "summary": "Full-duplex interaction models exhibit strong conversational agency, enabling natural, low-latency turn-taking, backchannels, and interruptions. However, completing tasks further requires task agency: timely tool invocation and argument revision following user corrections. Frontend-backend agents se", "url": "https://huggingface.co/papers/2611.25773", "github": "https://github.com/cyChen2003/duopra", "summary_zh": "提出Duopra，将全双工对话模型从会话能力扩展到任务能力，实现及时调用工具并根据用户纠正修改参数。"}, {"id": "2611.26627", "title": "RL Post-Training in Diffusion Transformers Is Activation Steering", "upvotes": 22, "summary": "A fixed set of steering vectors added to a frozen diffusion transformer recovers most of the quality gains from reinforcement learning post-training, indicating that much of the improvement comes from a constant shift rather than prompt-specific transformations.", "url": "https://huggingface.co/papers/2611.26627", "github": null, "summary_zh": "发现给冻结扩散Transformer加固定引导向量，可复现强化学习后训练的大部分质量提升，增益主要来自常量偏移。"}, {"id": "2611.21885", "title": "Language Models Can Rewrite Their Own Weights", "upvotes": 22, "summary": "Language models are trained once, frozen and deployed: improving one again takes another training run, and a prompt, a scaffold or extra computation at inference is gone once the task ends. A frontier model has been shown to edit the weights of a much smaller one. We ask whether a model can rewrite ", "url": "https://huggingface.co/papers/2611.21885", "github": null, "summary_zh": "研究语言模型能否重写自身权重以实现推理时的持久改进，而无需再次完整训练或依赖提示与脚手架。"}, {"id": "2611.15449", "title": "Reading the Unreadable: Text-Aware Image Super-Resolution Needs Reasoning", "upvotes": 21, "summary": "Text-aware image super-resolution (TAISR) aims to recover high-resolution images from low-resolution inputs while preserving textual content. Existing methods treat this as a visual restoration problem, yet severely degraded text often cannot be read from local visual evidence alone. Humans instead ", "url": "https://huggingface.co/papers/2611.15449", "github": "https://github.com/jasonleex1995/TAISR_needs_Reasoning", "summary_zh": "提出需要推理的文本感知超分辨率方法，让模型结合上下文推断严重退化的文字，而非仅做局部视觉恢复。"}, {"id": "2611.26408", "title": "Training Vision Models for LLM-Driven Weight-Space Programming", "upvotes": 19, "summary": "It has been demonstrated that, in certain settings, large language models can perform weight-space programming to directly modify the weights of neural networks. However, it is unknown how dedicated training of these networks can contribute to the successes of weight-space programming. We present a ", "url": "https://huggingface.co/papers/2611.26408", "github": null, "summary_zh": "研究专门训练视觉模型如何促进LLM驱动的权重空间编程，并验证相关训练方法的效果。"}, {"id": "2611.27973", "title": "MemOnce: A Scalable Memory Architecture for Large Language Models", "upvotes": 18, "summary": "Deploying large language models (LLMs) in long-horizon and continual interactions requires maintaining reusable memory states for future inference, posing challenges for existing architectures. Standard Transformers accumulate layer-wise, token-level KV caches, incurring linear GPU memory growth and", "url": "https://huggingface.co/papers/2611.27973", "github": "https://github.com/Clare-Nie/MemOnce", "summary_zh": "提出MemOnce，一种可扩展的LLM记忆架构，用可复用的记忆状态替代逐层累积的KV缓存，缓解显存线性增长。"}, {"id": "2611.26268", "title": "Accelerating Mixture of Block Attention via Dynamic Routing, KV-Centric Execution and Runtime Pipelining", "upvotes": 18, "summary": "LightningMoBA combines dynamic routing, KV-centric ownership, and runtime pipelining to accelerate long-context attention while maintaining or improving quality.", "url": "https://huggingface.co/papers/2611.26268", "github": "https://github.com/Tencent/LightningMoBA", "summary_zh": "提出LightningMoBA，结合动态路由、KV中心执行和运行时流水线，加速长上下文注意力并保持或提升质量。"}, {"id": "2611.26617", "title": "One Prior, Two Dynamics: Repurposing Video Diffusion Transformers for Self-Supervised Latent Action Learning", "upvotes": 14, "summary": "O2LaF repurposes a shared pretrained video model to learn inverse and forward latent action dynamics from unlabeled videos, achieving state-of-the-art few-shot action probing and zero-shot action transfer.", "url": "https://huggingface.co/papers/2611.26617", "github": "https://github.com/showlab/O2LaF", "summary_zh": "提出O2LaF，复用预训练视频扩散Transformer，从无标注视频中自监督学习潜在动作动态，实现少样本与零样本迁移。"}, {"id": "2611.25567", "title": "Online Mistake Detection in Instruction-Conditioned Procedural Video", "upvotes": 12, "summary": "An assistant monitoring a person performing a procedure is most useful when it can detect mistakes while there is still time to recover. This requires judging actions against task instructions as the video unfolds, identifying the attempted step, locating it in time, and assessing its execution. Exi", "url": "https://huggingface.co/papers/2611.25567", "github": null, "summary_zh": "研究指令条件下的程序性视频在线错误检测，在视频展开时判断动作是否符合任务指令并定位执行错误。"}, {"id": "2611.26286", "title": "Twice-Told Critiques: Claim-Level Homogenization of Peer Review in the LLM Era", "upvotes": 11, "summary": "Critique overlap among peer reviews is rising, and reviews identified as LLM-generated are less distinct from each other, indicating decreasing diversity of critiques.", "url": "https://huggingface.co/papers/2611.26286", "github": "https://github.com/IlyaGusev/twicetold", "summary_zh": "分析同行评审意见在LLM时代的趋同现象，发现评审间的批评重叠率上升，LLM生成的评审多样性下降。"}, {"id": "2611.21485", "title": "Lost in the Hallway: Benchmarking Persistent Spatial Memory Across Revisits", "upvotes": 10, "summary": "Persistent spatial understanding is essential for embodied agents to operate reliably in environments they repeatedly encounter. It requires recognizing revisited places despite viewpoint changes, distinguishing them from similar-looking rooms, and updating memories as environments change. Yet exist", "url": "https://huggingface.co/papers/2611.21485", "github": null, "summary_zh": "提出Lost in the Hallway基准，评测具身智能体在多次重访同一环境时的持久空间记忆能力。"}, {"id": "2611.25279", "title": "Accord: Universal Online Metric Localization and Dense Mapping from one Camera and an IMU", "upvotes": 10, "summary": "Dense metric mapping from a single camera and IMU remains challenging: visual-inertial odometry (VIO) provides metric motion but sparse geometry, whereas feed-forward depth models predict dense structure without ensuring metric scale. We present Accord, which constructs an accurate online dense metr", "url": "https://huggingface.co/papers/2611.25279", "github": "https://github.com/be2rlab/ACCORD", "summary_zh": "提出Accord，仅用单目相机和IMU实现在线度量定位与稠密建图，兼顾VIO的度量尺度与深度模型的稠密结构。"}, {"id": "2611.26239", "title": "Teaching Vision-Language-Action Models to Stop Safely", "upvotes": 9, "summary": "Vision-language-action (VLA) models enable robots to perform diverse tasks from visual observations and language instructions. While prior work has explored task suppression and refusal, stopping prohibited behavior once execution is underway and controlling the resulting physical response remain ch", "url": "https://huggingface.co/papers/2611.26239", "github": "https://github.com/franciscoliu/SAFI", "summary_zh": "提出让视觉-语言-动作机器人在执行中途安全停止被禁止行为的方法，并控制其产生的物理响应。"}]};
const ARCHIVE = ["2026-11-24", "2026-11-23", "2026-11-22", "2026-11-21", "2026-11-20", "2026-11-19", "2026-11-18", "2026-11-17", "2026-11-16", "2026-11-15", "2026-11-14", "2026-11-13", "2026-11-12", "2026-11-11", "2026-11-10", "2026-11-09", "2026-11-06", "2026-11-05", "2026-11-04", "2026-11-03", "2026-11-02", "2026-11-01", "2026-10-30"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
let D, cat = "全部";

// 收藏 / 已读：存在本浏览器
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("ghd:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ghd:" + k, JSON.stringify(v)); } catch {} },
};
let favs = store.get("favs", {}), read = new Set(store.get("read", []));
const saveRead = () => store.set("read", [...read].slice(-3000));

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) return "";
  const W = 64, H = 18, pts = ys.map((y, i) =>
    `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 2 - (y - lo) / (hi - lo) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="近 ${trend.length} 天 star 曲线">
    <title>${esc(trend[0][0])} ★${fmt(ys[0])} → ${esc(trend.at(-1)[0])} ★${fmt(ys.at(-1))}</title>
    <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function card(p) {
  const [owner, repo] = p.name.split("/");
  const flags = p.flags || [], related = p.related || [];
  const flagBadge = (kind, label) => flags.some(f => f.kind === kind) ? `<span class="badge warn">${label}</span>` : "";
  const relLabel = related.every(r => r.reason === "同作者") ? "同作者" : "同类";
  return `<article class="card ${p.suspect ? "suspect" : ""} ${read.has(p.name) ? "read" : ""}">
    <div class="top"><img src="${esc(p.owner_avatar)}&s=56" alt="" loading="lazy">
      <div class="name"><a class="main" href="${esc(p.url)}" target="_blank" rel="noopener" data-name="${esc(p.name)}"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a></div>
      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="d">${esc(p.summary_zh || p.summary)}</div>
      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
