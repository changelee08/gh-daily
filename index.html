注意力机制、LoRA 与 LLM 评测的交互式笔记"}, {"title": "PyWolf3D, a wolfenstein3D clone written from scratch in Python", "url": "https://github.com/atifcodesalot/pyWolf3D", "hn_url": "https://news.ycombinator.com/item?id=50338891", "points": 31, "comments": 8, "github": "atifcodesalot/pywolf3d", "title_zh": "PyWolf3D：用 Python 从零编写的 Wolfenstein 3D 克隆版"}], "papers": [{"id": "2611.05275", "title": "Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems", "upvotes": 85, "summary": "Route Anything is a framework for dynamically selecting and coordinating specialized AI models and policies across diverse tasks to improve performance and efficiency.", "url": "https://huggingface.co/papers/2611.05275", "github": "https://github.com/InfRec-Cardinal/route-anything", "summary_zh": "Route Anything框架动态选择并协调多种专用AI模型与策略，以在多样任务上提升性能与效率。"}, {"id": "2611.00617", "title": "Words Caught in the Heart: Simulating Person-Specific Expression for Self-Opaque Clients in Psychotherapy", "upvotes": 69, "summary": "Pandora is a psychotherapy client simulation framework that models evolving psychological and relational states to generate more authentic, individually aligned expressions and reduce AI-like responses.", "url": "https://huggingface.co/papers/2611.00617", "github": "https://github.com/whunextgen/Pandora", "summary_zh": "Pandora是心理治疗客户模拟框架，建模动态变化的心理与关系状态，生成更真实、个性化的表达，减少类AI式回应。"}, {"id": "2611.04814", "title": "Think Less, Locally: Local Preference Learning for Reasoning Compression", "upvotes": 65, "summary": "LoCo uses local preference learning to teach reasoning models when to stop deliberating, reducing output length substantially while preserving or improving accuracy across math and code tasks.", "url": "https://huggingface.co/papers/2611.04814", "github": "https://github.com/MuyaoYuan/LoCo", "summary_zh": "LoCo通过局部偏好学习教推理模型何时停止思考，大幅缩短输出长度，并保持或提升数学与代码任务的准确率。"}, {"id": "2611.05377", "title": "DreamX: Video Diffusion Model is a Universal Latent Action Learner", "upvotes": 51, "summary": "DreamX leverages a pretrained video diffusion model to learn compact, appearance-invariant latent actions that enable cross-embodiment transfer and efficient policy learning.", "url": "https://huggingface.co/papers/2611.05377", "github": null, "summary_zh": "DreamX利用预训练视频扩散模型学习紧凑且外观不变的潜在动作，实现跨形态迁移与高效策略学习。"}, {"id": "2611.04916", "title": "Behind Video Generation: Observations and Insights on Multimodal Understanding from Kling", "upvotes": 51, "summary": "Kling's multimodal understanding stack links caption density, perceptual text encoding, reward modeling, and evaluation protocols to improve controllable video generation.", "url": "https://huggingface.co/papers/2611.04916", "github": null, "summary_zh": "可灵团队的多模态理解体系，结合描述密度、文本编码、奖励建模与评测，提升可控视频生成质量。"}, {"id": "2611.05193", "title": "Factorized MLLM Embeddings for Composed Image Retrieval", "upvotes": 44, "summary": "FactEmbed improves composed image retrieval by decoupling query understanding from embedding construction through factorized latents that simulate visual modifications before retrieval.", "url": "https://huggingface.co/papers/2611.05193", "github": "https://github.com/cvlab-kaist/FactEmbed", "summary_zh": "FactEmbed通过因子化潜变量解耦查询理解与嵌入构建，并在检索前模拟视觉修改，改进组合图像检索。"}, {"id": "2611.03233", "title": "Axion 1.0: Open Agent Foundation Models, Simplified", "upvotes": 39, "summary": "Axion 1.0 is an open agent foundation model trained via a concise three-stage pipeline of supervised fine-tuning and reinforcement learning, achieving competitive agentic performance while fully releasing its data and training recipe.", "url": "https://huggingface.co/papers/2611.03233", "github": "https://github.com/bytedance/axion1_0", "summary_zh": "Axion 1.0是开源智能体基础模型，经三阶段监督微调与强化学习训练，性能具竞争力，并公开全部数据与训练方案。"}, {"id": "2611.05036", "title": "ToolSpace: Scaling Tool-Centric Environment Synthesis for Long-Horizon Agents", "upvotes": 34, "summary": "ToolSpace constructs realistic multi-environment tool-use benchmarks by mining execution traces, clustering tool compositions, and validating tasks through replayable state-aware random walks.", "url": "https://huggingface.co/papers/2611.05036", "github": "https://github.com/dongguanting/ToolSpace", "summary_zh": "ToolSpace通过挖掘执行轨迹、聚类工具组合，并借助可重放的状态感知随机游走验证任务，构建多环境工具使用基准。"}, {"id": "2611.05280", "title": "YANAMI: A Large-Scale Multimodal Dataset and Benchmark for Multiturn Stateful Interaction", "upvotes": 26, "summary": "YANAMI introduces a large-scale multimodal dialogue dataset and benchmark for stateful interaction, requiring models to track and realize evolving dialogue states across turns, and reveals that current unified multimodal models still struggle with this task.", "url": "https://huggingface.co/papers/2611.05280", "github": null, "summary_zh": "YANAMI提出大规模多模态多轮有状态对话数据集与基准，揭示现有统一多模态模型在跟踪对话状态上仍很吃力。"}, {"id": "2611.04418", "title": "VidUEU-Agent: A Data-Curation Agent for Multimodal Understanding, Editing, and Unified Tasks", "upvotes": 23, "summary": "VidUEU-Agent automates instruction data synthesis from raw videos via a multi-stage pipeline with autonomous iteration, yielding a 100K-sample dataset that improves multimodal model performance.", "url": "https://huggingface.co/papers/2611.04418", "github": "https://github.com/LRuca/VidUEU-Agent", "summary_zh": "VidUEU-Agent是数据整理智能体，通过多阶段自主迭代流程从原始视频合成指令数据，生成10万样本数据集以提升多模态模型性能。"}, {"id": "2610.39813", "title": "EvoTeam: Multi-Agent Collaboration via Evolving Teams", "upvotes": 23, "summary": "EvoTeam evolves multi-agent collaboration by jointly adapting team organization, interaction rules, and agent skills through execution experience while maintaining reusable team libraries.", "url": "https://huggingface.co/papers/2610.39813", "github": null, "summary_zh": "EvoTeam通过执行经验共同演化多智能体团队的组织结构、交互规则与智能体技能，并维护可复用的团队库。"}, {"id": "2611.03634", "title": "WebHarbor: Docking Real Websites for Evolving GUI Agent Environments", "upvotes": 19, "summary": "WebHarbor provides 153 executable, dockerized web environments for stable evaluation and reinforcement learning training of GUI agents, enabling strong generalization across multi-step and post-authentication tasks.", "url": "https://huggingface.co/papers/2611.03634", "github": "https://github.com/aiming-lab/WebHarbor", "summary_zh": "WebHarbor提供153个可执行的容器化真实网站环境，用于GUI智能体的稳定评测与强化学习训练，泛化能力强。"}, {"id": "2610.39714", "title": "MoLRSI: A Recursive Self-Improving AI agent for Molecular Discovery", "upvotes": 16, "summary": "MoLRSI is an AI agent that optimizes molecular design workflows and retains cross-task memory to improve search policies, achieving higher experimental hit rates in antibiotic and peptide binder discovery than expert-led methods.", "url": "https://huggingface.co/papers/2610.39714", "github": null, "summary_zh": "MoLRSI是自我递归改进的分子发现智能体，优化设计流程并保留跨任务记忆，在抗生素与肽结合物发现中命中率高于专家方法。"}, {"id": "2611.02501", "title": "SpecPilot: Autonomous Algorithm Discovery and Systems Optimization for Speculative Decoding", "upvotes": 16, "summary": "SpecPilot autonomously discovers deployment-specific algorithms and system optimizations to maximize speculative decoding speedups across diverse models, drafters, and serving regimes without quality loss.", "url": "https://huggingface.co/papers/2611.02501", "github": "https://github.com/StargazerX0/SpecPilot", "summary_zh": "SpecPilot自主发现针对部署场景的算法与系统优化，在不同模型、草稿模型和服务条件下最大化推测解码加速且不损失质量。"}, {"id": "2611.02079", "title": "ParetoSaddler: Pareto-Guided Optimization of Agent Harnesses for Quality and Cost", "upvotes": 16, "summary": "ParetoSaddler improves LLM agent harnesses by separately promoting intermediate candidates via Bayesian bootstrap Pareto support and selecting final deployments, boosting quality while reducing cost.", "url": "https://huggingface.co/papers/2611.02079", "github": null, "summary_zh": "ParetoSaddler用帕累托引导优化LLM智能体框架，分别晋升中间候选并选定最终部署方案，在降低成本的同时提升质量。"}, {"id": "2610.40753", "title": "\"Shall We Approve?\" Consequence-Aware Approval for Autonomous Coding Agents", "upvotes": 12, "summary": "Caper pre-executes shell commands in isolated sandboxes to evaluate real-world effects before approval, reducing harmful outcomes compared to text-based approvers.", "url": "https://huggingface.co/papers/2610.40753", "github": "https://github.com/wudaoz/Caper", "summary_zh": "Caper在隔离沙箱中预先执行shell命令以评估实际影响，再决定是否批准，比基于文本的审批器更能减少有害后果。"}, {"id": "2610.40747", "title": "Mage-VL-Cowork: A Full Training Recipe to Learn Hybrid Computer Use From Evolved Harnesses", "upvotes": 12, "summary": "Mage-VL-Cowork is a 4B hybrid computer-use agent trained via a progressive curriculum and scalable synthetic data generation, achieving state-of-the-art performance on OSWorld-Verified with efficient reasoning.", "url": "https://huggingface.co/papers/2610.40747", "github": null, "summary_zh": "Mage-VL-Cowork是4B混合计算机操作智能体，经渐进课程与合成数据训练，在OSWorld-Verified上达到最优且推理高效。"}, {"id": "2611.04035", "title": "Recursa: Toward Recursively Self-Improving Foundation Model Systems", "upvotes": 11, "summary": "Recursa is a self-improving foundation model system that adapts to new domains by recursively learning from its own experience, storing skills and reflections in a knowledge repository, and validating improvements without human supervision or stronger teachers.", "url": "https://huggingface.co/papers/2611.04035", "github": null, "summary_zh": "Recursa是可递归自我改进的基础模型系统，通过从自身经验中学习、将技能与反思存入知识库，无需人工或更强教师即可验证改进。"}, {"id": "2611.04303", "title": "FlowTranslator: Training-Free In-Image Machine Translation with Flow-Based Editing", "upvotes": 10, "summary": "FlowTranslator is a training-free framework for in-image machine translation that uses diffusion trajectory controls to generate accurate translated text within images without paired training data.", "url": "https://huggingface.co/papers/2611.04303", "github": null, "summary_zh": "FlowTranslator是免训练的图内机器翻译框架，利用基于流的编辑与扩散轨迹控制，无需成对数据即可生成准确译文。"}, {"id": "2610.40574", "title": "Every Token Needs Its Own Teacher: Multi-teacher Adaptive On-policy Self-distillation", "upvotes": 9, "summary": "Multi-teacher Adaptive On-policy Self-Distillation selects a preferred teacher for each token during training, improving mathematical reasoning performance over fixed-teacher methods.", "url": "https://huggingface.co/papers/2610.40574", "github": "https://github.com/xingzhejun/MTA-OPSD", "summary_zh": "该方法为训练中每个token选择最优教师，即多教师自适应同策略自蒸馏，相比固定教师方法提升数学推理性能。"}]};
const ARCHIVE = ["2026-11-05", "2026-11-04", "2026-11-03", "2026-11-02", "2026-11-01", "2026-10-30"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
let D, cat = "全部";

// 收藏 / 已读：存在本浏览器
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("ghd:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ghd:" + k, JSON.stringify(v)); } catch {} },
};
let favs = store.get("favs", {}), read = new Set(store.get("read", []));
const saveRead = () => store.set("read", [...read].slice(-3000));

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) return "";
  const W = 64, H = 18, pts = ys.map((y, i) =>
    `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 2 - (y - lo) / (hi - lo) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="近 ${trend.length} 天 star 曲线">
    <title>${esc(trend[0][0])} ★${fmt(ys[0])} → ${esc(trend.at(-1)[0])} ★${fmt(ys.at(-1))}</title>
    <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function card(p) {
  const [owner, repo] = p.name.split("/");
  const flags = p.flags || [], related = p.related || [];
  const flagBadge = (kind, label) => flags.some(f => f.kind === kind) ? `<span class="badge warn">${label}</span>` : "";
  const relLabel = related.every(r => r.reason === "同作者") ? "同作者" : "同类";
  return `<article class="card ${p.suspect ? "suspect" : ""} ${read.has(p.name) ? "read" : ""}">
    <div class="top"><img src="${esc(p.owner_avatar)}&s=56" alt="" loading="lazy">
      <div class="name"><a class="main" href="${esc(p.url)}" target="_blank" rel="noopener" data-name="${esc(p.name)}"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a></div>
      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="d">${esc(p.summary_zh || p.summary)}</div>
      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
