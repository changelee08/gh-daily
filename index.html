essed with interfaces favoring native visual reasoning and tool use, achieving high success in simulated and real manipulation tasks.", "url": "https://huggingface.co/papers/2611.31201", "github": "https://github.com/DravenALG/Embo-Harness", "summary_zh": "研究表明，配合利于原生视觉推理与工具调用的接口，前沿多模态模型可作机器人策略，在仿真与真实操作中成功率高。"}, {"id": "2611.30662", "title": "WeMM-Ecom: Advancing Multimodal Content Understanding for WeChat E-Commerce", "upvotes": 54, "summary": "WeMM-Ecom, a family of multimodal large language models spanning dense and mixture-of-experts sizes, is trained with continued pre-training and hybrid-thinking post-training to achieve strong e-commerce and general-purpose results and is deployed in WeChat.", "url": "https://huggingface.co/papers/2611.30662", "github": "https://github.com/Tencent/WeMM-Ecom", "summary_zh": "面向微信电商的多模态大模型家族WeMM-Ecom，经持续预训练与混合思考后训练，电商及通用任务表现强，已部署于微信。"}, {"id": "2611.12164", "title": "Let the Fixer Decide: Training a Code Localizer from the Fixer's Likelihood", "upvotes": 52, "summary": "A code localizer is trained with scores from a frozen fixer via weighted supervised fine-tuning, improving bug localization and patch success for a small coding agent without tests or reinforcement learning.", "url": "https://huggingface.co/papers/2611.12164", "github": "https://github.com/misraj-ai/locfix", "summary_zh": "用冻结修复模型的似然分数加权微调代码定位器，无需测试或强化学习，即可提升小型编码智能体的补丁成功率。"}, {"id": "2611.26389", "title": "ViDecide: Teaching Video Diffusion Models to Reason and Plan Step by Step", "upvotes": 38, "summary": "ViDecide trains video diffusion models to make causal state-transition and stopping decisions, using Corrective Fine-tuning to improve multi-step planning success without policy gradients.", "url": "https://huggingface.co/papers/2611.26389", "github": "https://github.com/Kevin-thu/ViDecide", "summary_zh": "ViDecide通过纠正微调，让视频扩散模型学会因果状态转移与停止决策，无需策略梯度即可提升多步规划成功率。"}, {"id": "2611.27376", "title": "Composable Soft-Prompt Distillation of RL Experts: Toward Continual Post-Training", "upvotes": 28, "summary": "RL post-training typically produces domain experts that must then be consolidated into one model, and as new experts keep arriving, this consolidation becomes a continual process. Weight merging and multi-teacher on-policy distillation (MOPD) must re-consolidate the whole model whenever an expert is", "url": "https://huggingface.co/papers/2611.27376", "github": "https://github.com/UCSB-AI/CSPD", "summary_zh": "提出可组合软提示蒸馏，将多个强化学习专家的能力持续整合进单一模型，避免新专家到来时重新整合整个模型。"}, {"id": "2611.18639", "title": "SynthDCB: World Distillation for Scalable Device Control Benchmarking", "upvotes": 25, "summary": "Scaling device-control evaluation requires scaling both interactive worlds and the tasks agents must solve. We introduce SynthDCB, a benchmark for environment awareness and device control built through world distillation (WD). World distillation transforms knowledge of device behaviors, constraints,", "url": "https://huggingface.co/papers/2611.18639", "github": "https://github.com/X-LANCE/SynthDCB", "summary_zh": "SynthDCB通过世界蒸馏构建可扩展的设备控制基准，同时扩展交互环境与任务，用于评测智能体的环境感知与设备控制能力。"}, {"id": "2611.30898", "title": "World Models as Native Latent Action Models", "upvotes": 24, "summary": "Native LAM distills compact latent actions from a pretrained video diffusion transformer via learnable dynamics registers, and PAWlicy uses these actions to pretrain VLA policies without generating video, achieving strong robotic control and cross-embodiment transfer.", "url": "https://huggingface.co/papers/2611.30898", "github": null, "summary_zh": "从视频扩散Transformer蒸馏潜在动作，PAWlicy借此无需生成视频即可预训练VLA策略，并实现良好的机器人控制与跨本体迁移。"}, {"id": "2611.30597", "title": "ViDiHand2: Unifying Video Diffusion Priors and Hand Geometry for 3D Hand Motion Reconstruction in the Wild", "upvotes": 20, "summary": "Learning robot manipulation from egocentric human videos requires accurate metric 3D hand motion. Recent methods leverage pretrained video diffusion model (VDM) priors to recover occluded hands directly from full-frame videos, but their appearance-based depth regression generalizes poorly to unseen ", "url": "https://huggingface.co/papers/2611.30597", "github": null, "summary_zh": "ViDiHand2结合视频扩散先验与手部几何，从野外全帧视频中恢复被遮挡的手部，实现可靠的三维手部运动重建。"}, {"id": "2611.25419", "title": "DiLE: Discrimination-Aware Latent-Space Learning for Universal Multimodal Embeddings", "upvotes": 17, "summary": "A discrimination-aware latent-space learning framework combines task guidance with on-policy retrieval feedback to preserve discriminative evidence in multimodal embeddings and improve retrieval across modalities and tasks.", "url": "https://huggingface.co/papers/2611.25419", "github": null, "summary_zh": "DiLE提出判别感知的潜空间学习框架，结合任务引导与在线检索反馈，保留多模态嵌入中的判别信息，提升跨模态与跨任务检索效果。"}, {"id": "2611.28489", "title": "Open Vision Banana: An Open Framework for Unified Visual Perception through Generation in RGB Space", "upvotes": 16, "summary": "Vision Banana showed that a closed image generator, instruction-tuned to paint perception outputs as RGB images, becomes a generalist vision model. Does this carry over to open generators, and if not, what fails? We answer with Open Vision Banana (OVB), an open framework that adapts the 7B diffusion", "url": "https://huggingface.co/papers/2611.28489", "github": "https://github.com/isLinXu/open-vision-banana", "summary_zh": "将闭源生成器Vision Banana的思路迁移到开源扩散模型，把感知输出绘制为RGB图像，实现统一视觉感知。"}, {"id": "2611.29355", "title": "Polytropos: What Do Vision-Language Model Descriptions Make of a Cultural Object?", "upvotes": 16, "summary": "Vision-language models have become a new kind of describer, writing about almost anything people see, and their descriptions now shape how cultures are known by people and by other models. Descriptions of cultures tend to turn particular things into types, and what a description loses shows what its", "url": "https://huggingface.co/papers/2611.29355", "github": null, "summary_zh": "Polytropos考察视觉语言模型对文化物件的描述，发现其倾向把具体事物归为类型，描述所丢失的内容也揭示了其偏向。"}, {"id": "2611.30207", "title": "What Makes Good Data for Training Coding Agents? A Systematic Study on SWE-Gym", "upvotes": 16, "summary": "Auditing reward labels in coding-agent reinforcement learning tasks shows many unsolved tasks are mislabeled, and training on corrected tasks improves policy performance on SWE-bench benchmarks.", "url": "https://huggingface.co/papers/2611.30207", "github": "https://github.com/Arist12/SWE-Gym-Verified", "summary_zh": "审计编码智能体强化学习任务的奖励标签，发现大量未解任务标注错误，修正后训练可提升SWE-bench表现。"}, {"id": "2611.26358", "title": "Beam Model Technical Report", "upvotes": 14, "summary": "Beam is a sparse Mixture-of-Experts language model optimized for coding, reasoning, and agentic workloads, using large-scale asynchronous reinforcement learning, long-context midtraining, quantization, and speculative decoding to deliver strong reasoning and safety with efficient inference.", "url": "https://huggingface.co/papers/2611.26358", "github": "https://github.com/reflection-oss/cookbook", "summary_zh": "Beam是面向编码、推理与智能体任务的稀疏MoE语言模型，借助异步强化学习、长上下文中训练与投机解码实现高效推理。"}, {"id": "2611.30157", "title": "UUBench: Understanding the Unspoken toward Full-Duplex Multimodal Interaction", "upvotes": 14, "summary": "UUBench assesses how well multimodal interactive systems understand and respond to users' implicit communicative needs through process- and outcome-oriented scoring grounded in observable audiovisual evidence.", "url": "https://huggingface.co/papers/2611.30157", "github": null, "summary_zh": "UUBench评测多模态交互系统理解用户隐含交流需求的能力，基于可观察的音视频证据进行过程与结果评分。"}, {"id": "2611.30495", "title": "DexDuet: Learning Contact-Preserving Bimanual Dexterity from Human Demonstrations", "upvotes": 13, "summary": "Human demonstrations provide a rich source of bimanual dexterous skills, yet transferring them to robot hands remains challenging. Existing methods primarily optimize object trajectory tracking, often overlooking how human hands interact with the object. Even with accurate tracking, robots may conta", "url": "https://huggingface.co/papers/2611.30495", "github": "https://github.com/HaoranZhangumich/DexDuet", "summary_zh": "DexDuet从人类示范中学习保持接触的双手灵巧操作，不仅跟踪物体轨迹，还保留人手与物体的接触交互，以迁移至机器人手。"}, {"id": "2611.29064", "title": "Single-Transformer Latent Diffusion", "upvotes": 12, "summary": "A single diffusion transformer can unify encoding, generation, and decoding by treating them as position-aligned sequence maps distinguished by a mode token and timestep, improving image generation quality and efficiency.", "url": "https://huggingface.co/papers/2611.29064", "github": "https://github.com/haoyuhsu/Unified-LDM", "summary_zh": "单Transformer潜扩散模型将编码、生成与解码统一为位置对齐的序列映射，借模式标记与时间步区分，提升图像生成质量与效率。"}, {"id": "2611.31198", "title": "ToolSmith: An Automatic Tool-Generation Framework for Multimodal Search Agents", "upvotes": 11, "summary": "Recent multimodal search agents use reasoning, vision, and live web search across many turns to answer questions beyond parametric knowledge by orchestrating a small library of hand-crafted search and visual tools. However, the library is laborious to create and maintain, and frozen when new query t", "url": "https://huggingface.co/papers/2611.31198", "github": "https://github.com/uclanlp/OpenVLHarness", "summary_zh": "ToolSmith是多模态搜索智能体的自动工具生成框架，能按新查询自动生成工具，替代人工维护的固定工具库。"}, {"id": "2611.31358", "title": "Nemotron-Labs-VisualCreation: Pixel as Code for Agentic Visual Creation", "upvotes": 10, "summary": "Visual creation demands expressive imagery together with precise control over text, layout, and structure. We introduce Nemotron-Labs-VisualCreation, an agentic framework that connects these capabilities through Pixel as Code. Raster images are represented by learned discrete visual tokens, while st", "url": "https://huggingface.co/papers/2611.31358", "github": null, "summary_zh": "Nemotron-Labs-VisualCreation提出像素即代码的智能体视觉创作框架，用离散视觉令牌表示栅格图像，并对文字、版式与结构实现精确控制。"}, {"id": "2611.31015", "title": "Can Latent Reasoning Drive LLM Outputs Without a Trace?", "upvotes": 10, "summary": "Models can use deep latent reasoning to pursue hidden objectives while generating chain-of-thought explanations that appear task-appropriate and evade output-based monitoring.", "url": "https://huggingface.co/papers/2611.31015", "github": null, "summary_zh": "研究表明，大模型可借深层潜在推理追求隐藏目标，同时生成看似合理的思维链解释，从而规避基于输出的监控。"}, {"id": "2611.30813", "title": "HIVE-Bench: Evaluating Patch-Level Visual Representations for Egocentric Robot Manipulation", "upvotes": 10, "summary": "A shared flow-matching policy that reads dense patch tokens from multiple vision encoders improves success on egocentric bimanual tasks, and inverse-dynamics readout of commanded motion is a strong pre-training signal, while recognition, depth, and correspondence transfer unreliably.", "url": "https://huggingface.co/papers/2611.30813", "github": "https://github.com/KolaKivy/HIVE-Bench", "summary_zh": "HIVE-Bench评测以流匹配策略读取多编码器图块特征的以自我为中心机器人操作，发现逆动力学是有效预训练信号。"}]};
const ARCHIVE = ["2026-11-25", "2026-11-24", "2026-11-23", "2026-11-22", "2026-11-21", "2026-11-20", "2026-11-19", "2026-11-18", "2026-11-17", "2026-11-16", "2026-11-15", "2026-11-14", "2026-11-13", "2026-11-12", "2026-11-11", "2026-11-10", "2026-11-09", "2026-11-06", "2026-11-05", "2026-11-04", "2026-11-03", "2026-11-02", "2026-11-01", "2026-10-30"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
let D, cat = "全部";

// 收藏 / 已读：存在本浏览器
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("ghd:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ghd:" + k, JSON.stringify(v)); } catch {} },
};
let favs = store.get("favs", {}), read = new Set(store.get("read", []));
const saveRead = () => store.set("read", [...read].slice(-3000));

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) return "";
  const W = 64, H = 18, pts = ys.map((y, i) =>
    `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 2 - (y - lo) / (hi - lo) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="近 ${trend.length} 天 star 曲线">
    <title>${esc(trend[0][0])} ★${fmt(ys[0])} → ${esc(trend.at(-1)[0])} ★${fmt(ys.at(-1))}</title>
    <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function card(p) {
  const [owner, repo] = p.name.split("/");
  const flags = p.flags || [], related = p.related || [];
  const flagBadge = (kind, label) => flags.some(f => f.kind === kind) ? `<span class="badge warn">${label}</span>` : "";
  const relLabel = related.every(r => r.reason === "同作者") ? "同作者" : "同类";
  return `<article class="card ${p.suspect ? "suspect" : ""} ${read.has(p.name) ? "read" : ""}">
    <div class="top"><img src="${esc(p.owner_avatar)}&s=56" alt="" loading="lazy">
      <div class="name"><a class="main" href="${esc(p.url)}" target="_blank" rel="noopener" data-name="${esc(p.name)}"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a></div>
      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="d">${esc(p.summary_zh || p.summary)}</div>
      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
