d correct memories before acting, improving performance and reducing memory-induced degradation across agentic benchmarks.", "url": "https://huggingface.co/papers/2611.14320", "github": "https://github.com/yukyeongleee/wikitrace", "summary_zh": "WikiTrace将每条经验链接到源轨迹与理由，使LLM智能体行动前可验证和修正记忆，减少记忆导致的性能下降。"}, {"id": "2611.14210", "title": "Tree-Ising: Repairing Language Models with Bit-Level Ising Edits", "upvotes": 62, "summary": "Tree-Ising repairs reasoning loops in LLM weights by solving sparse Ising/QUBO problems over BF16 parameters, improving math benchmark accuracy with fewer weight edits and no gradient or LLM-token cost.", "url": "https://huggingface.co/papers/2611.14210", "github": "https://github.com/TheQuantumGOAT/Tree-Ising", "summary_zh": "Tree-Ising以BF16参数上的稀疏Ising/QUBO求解修复LLM权重中的推理循环，编辑少且无梯度与token成本。"}, {"id": "2611.13001", "title": "One Table, Many Queries: Benchmarking Generalist Tabular Models Across Generation, Imputation, and Prediction", "upvotes": 40, "summary": "A large aligned benchmark reveals that tabular generation, imputation, and prediction share useful conditional information but show distinct fidelity rankings and objective interactions, motivating unified models that improve categorical reconstruction and joint sampling.", "url": "https://huggingface.co/papers/2611.13001", "github": "https://github.com/limix-ldm-ai/OTBench", "summary_zh": "构建大型统一基准，发现表格生成、填补与预测共享条件信息但保真度排序不同，推动统一模型的提出。"}, {"id": "2610.40394", "title": "Scaling Mathematical Proof Supervision from Structured Textbooks", "upvotes": 39, "summary": "A large-scale corpus of structured proof-supervision records derived from university mathematics textbooks improves language model mathematical reasoning by 16.7 percentage points over a base model when used for fine-tuning.", "url": "https://huggingface.co/papers/2610.40394", "github": null, "summary_zh": "从大学数学教材构建结构化证明监督语料，用于微调后使语言模型数学推理能力提升16.7个百分点。"}, {"id": "2611.13410", "title": "SteerDistill: Quantizing LLM Agents via Closed-Loop Teacher Steering", "upvotes": 31, "summary": "Low-bit quantized LLM agents can recover much of their task success through closed-loop guidance from a full-precision teacher, followed by unassisted student training on corrected and reference turns.", "url": "https://huggingface.co/papers/2611.13410", "github": "https://github.com/air-embodied-brain/SteerDistill", "summary_zh": "SteerDistill借助全精度教师闭环引导量化智能体，再进行无辅助训练，恢复大部分任务成功率。"}, {"id": "2611.10649", "title": "MACaQ: Fast, Model Agnostic Calibrated Quantization for Low-Precision Weights and Activations", "upvotes": 30, "summary": "MACaQ is an MXFP4 W4A4 post-training quantization method that quantizes each linear layer independently using online activation transforms and Hessian-aware refinement, reducing cost while preserving accuracy across language and diffusion models.", "url": "https://huggingface.co/papers/2611.10649", "github": "https://github.com/huawei-csl/MACaQ", "summary_zh": "MACaQ提出MXFP4 W4A4后训练量化，逐层独立量化并结合Hessian感知优化，降低成本且保持精度。"}, {"id": "2610.39671", "title": "Incentivizing Self-Learning in Large Language Models via Reinforcement Learning", "upvotes": 27, "summary": "Large language models (LLMs) draw on parametric knowledge and retrieval-augmented generation (RAG) to solve knowledge-intensive tasks. Yet problem solving in unfamiliar domains calls for tightly coupled knowledge acquisition and reasoning, beyond factual retrieval and aggregation or learning solely ", "url": "https://huggingface.co/papers/2610.39671", "github": null, "summary_zh": "通过强化学习激励LLM自主学习，使其在陌生领域中结合知识获取与推理，而非仅依赖检索与记忆。"}, {"id": "2611.12177", "title": "Embodied First Exam", "upvotes": 27, "summary": "Early successes on agentic robotics point to a potential paradigm shift toward using coding agents to control robots. Existing robotics benchmarks are built around visuomotor policy learning, leaving it open whether coding agents can reliably control diverse robots under physical-world constraints. ", "url": "https://huggingface.co/papers/2611.12177", "github": "https://github.com/mll-lab-nu/embodied-first-exam", "summary_zh": "Embodied First Exam基准检验编码智能体能否在物理约束下可靠控制多种机器人。"}, {"id": "2611.14309", "title": "MMDM: Measuring Massive Multitask Decision Making", "upvotes": 27, "summary": "System-1 Decision Models directly make structured probabilistic decisions over query-specified options given a state in a single forward pass, without autoregressively generating reasoning trajectories or textual responses. Recent evaluations cover diverse tasks but often rely on existing benchmarks", "url": "https://huggingface.co/papers/2611.14309", "github": "https://github.com/mmdm-benchmark/mmdm", "summary_zh": "MMDM基准评估System-1决策模型单次前向传播直接输出结构化概率决策，无需生成推理链。"}, {"id": "2611.07464", "title": "FINCOSMOS: An Open-World Evaluation Paradigm for Agents in Finance", "upvotes": 25, "summary": "Language agents increasingly work for users on the open Web, and finance is where trusting them is hardest. The data must come from the Web, the strategy lives in the user's head, and correctness depends on time, so an agent can fail silently: a strategy the user never asked for, unverified data, or", "url": "https://huggingface.co/papers/2611.07464", "github": null, "summary_zh": "FINCOSMOS提出金融领域开放网络环境的智能体评估范式，检测智能体未请求策略、未验证数据等静默失败。"}, {"id": "2611.10866", "title": "The Surprising Effectiveness of Deleting Weights in LLM Post-Training", "upvotes": 19, "summary": "How little of a pretrained large language model (LLM) has to change for it to acquire new capabilities? We find that zeroing fewer than 0.05% of its weights, with no other modification, matches full fine-tuning (FFT) at scale across three LLM post-training regimes: reinforcement learning with verifi", "url": "https://huggingface.co/papers/2611.10866", "github": "https://github.com/agentic-learning-ai-lab/deleting-weights", "summary_zh": "研究发现将LLM不到0.05%的权重置零，即可在多种后训练场景中匹配全量微调效果。"}, {"id": "2608.22237", "title": "Read Less, Solve More: Token-Efficient Sparse Reading of External Content for AI Agents", "upvotes": 18, "summary": "Web-facing AI agents repeatedly access webpages, documents, repositories, and tool responses, yet reading interfaces often expose entire objects when only sparse evidence is needed. This over-reading increases token and latency costs and can dilute relevant evidence. We present SparseRead, a reusabl", "url": "https://huggingface.co/papers/2608.22237", "github": null, "summary_zh": "SparseRead提出稀疏读取外部内容的方法，让Web智能体只读取所需证据，降低token与延迟成本。"}, {"id": "2611.12527", "title": "WaveGen: Truly End-to-End Waveform Generation via Internal Spectral Trajectory Learning", "upvotes": 17, "summary": "WaveGen is a fully end-to-end diffusion framework for text-to-waveform generation that jointly learns spectral and waveform trajectories via Spectral Forcing without external audio codecs, vocoders, latent models, alignment modules, or self-supervised representations, achieving state-of-the-art text-to-speech results.", "url": "https://huggingface.co/papers/2611.12527", "github": "https://github.com/sh-lee-prml/WaveGen", "summary_zh": "WaveGen以内部频谱轨迹学习实现文本到波形的端到端扩散生成，无需编解码器与声码器。"}, {"id": "2611.10193", "title": "Ensemble Routing for Prompt-Adaptive Cost-Aware LLM Inference", "upvotes": 14, "summary": "PISA and PISA-E use prompt-adaptive capability estimation to route prompts or select cost-aware ensembles, improving cost-performance trade-offs across LLM routing benchmarks.", "url": "https://huggingface.co/papers/2611.10193", "github": null, "summary_zh": "PISA与PISA-E利用提示自适应能力估计进行路由或选择成本感知的模型集成，提升成本与性能的权衡。"}, {"id": "2611.08286", "title": "Interactive Visual Gym: Evaluating Visual Interaction Models with Simulated Users in Interactive Worlds", "upvotes": 13, "summary": "Interactive Visual Gym enables closed-loop evaluation and training of visual interaction models by jointly simulating task environments and human users, exposing limitations in state-of-the-art VLMs and improving performance through closed-loop training.", "url": "https://huggingface.co/papers/2611.08286", "github": "https://github.com/SalesforceAIResearch/Interactive-Visual-Gym", "summary_zh": "Interactive Visual Gym联合模拟任务环境与人类用户，实现视觉交互模型的闭环评估与训练。"}, {"id": "2611.13028", "title": "GTAGym: Real AAA Game Tasks Environment for Evaluation and Reinforcement Learning", "upvotes": 13, "summary": "AAA games offer a rich testbed for evaluating agent perception, reasoning, and control. However, evaluating whether agents can complete tasks in AAA games is challenging and often human-annotated because task outcomes are often difficult to verify automatically, let alone applying it for Reinforceme", "url": "https://huggingface.co/papers/2611.13028", "github": "https://github.com/ljbro/GTAGym", "summary_zh": "GTAGym提供真实3A游戏任务环境，用于评估智能体的感知、推理与控制能力，并支持强化学习。"}, {"id": "2611.12304", "title": "Evolving Infra: Agent-Adaptive LLM Serving at Scale", "upvotes": 11, "summary": "Agentic workloads are a major source of LLM inference demand. Existing prefill--decode (PD) disaggregated serving systems offer limited flexibility for runtime adaptation of compute allocation and KV cache management, and rely on coarse signals that only partly capture the diverse and dynamic agent ", "url": "https://huggingface.co/papers/2611.12304", "github": "https://github.com/mit-han-lab/EvolvingInfra", "summary_zh": "Evolving Infra提出面向智能体工作负载的自适应LLM服务系统，运行时动态调整计算分配与KV缓存管理。"}, {"id": "2611.01527", "title": "From Tool State to Scientific Action: Auditing Decision Provenance in Biomedical Research Agents", "upvotes": 11, "summary": "A scientific agent can give the same verdict while reading and citing different evidence. BioAgent-DF tests this separation using paired reference and candidate values saved at the same scientific computation site. It restores or transplants those values at their original coordinates, then runs the ", "url": "https://huggingface.co/papers/2611.01527", "github": null, "summary_zh": "BioAgent-DF替换相同位置的参考与候选值，审计生物医学智能体的决策依据是否与结论一致。"}, {"id": "2611.13576", "title": "PhyRubric: Rubric-Grounded Diagnostic Evaluation of Physical Commonsense in Text-to-Video Generation", "upvotes": 10, "summary": "A rubric-based diagnostic benchmark and judge assess physical commonsense in text-to-video generation, showing that current models still struggle and that the judge aligns closely with human judgments.", "url": "https://huggingface.co/papers/2611.13576", "github": "https://github.com/chenyil6/phyRubric", "summary_zh": "PhyRubric以评分表构建诊断基准与评判器，评估文本生成视频的物理常识，评判结果与人类一致。"}, {"id": "2611.10486", "title": "Test-Time Scaling for Diffusion Language Models with Frequency-Aware Remasking", "upvotes": 8, "summary": "Diffusion language models (DLMs) generate text through iterative denoising, where decisions about which tokens to commit or remask strongly affect output quality. Existing certainty-aware strategies rely on instantaneous confidence or entropy, but these local signals can be misleading on difficult r", "url": "https://huggingface.co/papers/2611.10486", "github": null, "summary_zh": "提出频率感知重掩码策略，改进扩散语言模型的测试时扩展，避免瞬时置信度与熵的误导。"}]};
const ARCHIVE = ["2026-11-13", "2026-11-12", "2026-11-11", "2026-11-10", "2026-11-09", "2026-11-06", "2026-11-05", "2026-11-04", "2026-11-03", "2026-11-02", "2026-11-01", "2026-10-30"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
let D, cat = "全部";

// 收藏 / 已读：存在本浏览器
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("ghd:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ghd:" + k, JSON.stringify(v)); } catch {} },
};
let favs = store.get("favs", {}), read = new Set(store.get("read", []));
const saveRead = () => store.set("read", [...read].slice(-3000));

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) return "";
  const W = 64, H = 18, pts = ys.map((y, i) =>
    `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 2 - (y - lo) / (hi - lo) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="近 ${trend.length} 天 star 曲线">
    <title>${esc(trend[0][0])} ★${fmt(ys[0])} → ${esc(trend.at(-1)[0])} ★${fmt(ys.at(-1))}</title>
    <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function card(p) {
  const [owner, repo] = p.name.split("/");
  const flags = p.flags || [], related = p.related || [];
  const flagBadge = (kind, label) => flags.some(f => f.kind === kind) ? `<span class="badge warn">${label}</span>` : "";
  const relLabel = related.every(r => r.reason === "同作者") ? "同作者" : "同类";
  return `<article class="card ${p.suspect ? "suspect" : ""} ${read.has(p.name) ? "read" : ""}">
    <div class="top"><img src="${esc(p.owner_avatar)}&s=56" alt="" loading="lazy">
      <div class="name"><a class="main" href="${esc(p.url)}" target="_blank" rel="noopener" data-name="${esc(p.name)}"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a></div>
      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="d">${esc(p.summary_zh || p.summary)}</div>
      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
