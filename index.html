onmental feedback, revealing that single-view competence does not transfer to composed tasks.", "url": "https://huggingface.co/papers/2611.26444", "github": "https://github.com/Mind2Act/Mind2Act_World", "summary_zh": ""}, {"id": "2611.26409", "title": "WeMM-Video: Pushing the Frontiers of Open-Source Omni-Modal Video Understanding", "upvotes": 44, "summary": "WeMM-Video is a family of Chinese-English bilingual omni-modal foundation models that unify text, image, audio, and video processing for joint audio-visual perception and reasoning, using hybrid thinking modes and large-scale training to achieve strong open-source video understanding results.", "url": "https://huggingface.co/papers/2611.26409", "github": "https://github.com/Tencent/WeMM-Video", "summary_zh": ""}, {"id": "2611.26590", "title": "Probing the \"Conscious\" Mind: Selective Access and Global Workspace in Vision-Language Models", "upvotes": 42, "summary": "Vision-language models (VLMs) integrate visual and textual information, but their outputs do not reveal internal concept representations. Global workspace theory (GWT) proposes that information is selected from parallel brain processes, integrated in a shared workspace, and made available to special", "url": "https://huggingface.co/papers/2611.26590", "github": null, "summary_zh": ""}, {"id": "2611.26629", "title": "Posterior Matching Distillation", "upvotes": 37, "summary": "Posterior Matching Distillation trains a stochastic student to match a teacher diffusion model’s full posterior via tilted mean constraints, enabling high-quality few-step image generation without auxiliary score networks.", "url": "https://huggingface.co/papers/2611.26629", "github": "https://github.com/yesiltepe-hidir/PMD", "summary_zh": ""}, {"id": "2611.26595", "title": "Coda-DaVinci: Reimagining Video Generation with Code2Video", "upvotes": 35, "summary": "A task-adaptive agentic framework utilizes 3D proxies, physics simulation, and multi-agent coordination to enhance the structural control, physical plausibility, and visual realism of generated videos.", "url": "https://huggingface.co/papers/2611.26595", "github": "https://github.com/FrankYang-17/Coda", "summary_zh": ""}, {"id": "2611.21383", "title": "The Mask Is Not the Object: Volumetric Supervision for 3D Gaussian Segmentation", "upvotes": 32, "summary": "A plug-and-play objective, VODA, groups per-pixel contributors by local depth to supervise all Gaussians in selected depth clusters, improving volumetric segmentation and enabling evaluation via Removal-3D and Removal Depth Error.", "url": "https://huggingface.co/papers/2611.21383", "github": "https://github.com/jhxcho/voda", "summary_zh": ""}, {"id": "2611.26603", "title": "Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth", "upvotes": 31, "summary": "A single scalable network estimates dense metric depth for images and video at native resolution, jointly improving metric accuracy, boundary sharpness, and temporal consistency.", "url": "https://huggingface.co/papers/2611.26603", "github": "https://github.com/apple-aiml-research/ml-depth-pro-2", "summary_zh": ""}, {"id": "2611.26107", "title": "HiUni: Harmonizing Understanding and Generation in Shared Visual Space", "upvotes": 25, "summary": "Unified multimodal models aim to support visual understanding and generation within a single framework. However, prevailing approaches often separate their visual representations or backbone computation to accommodate the different requirements of these two tasks, which limits the degree of unificat", "url": "https://huggingface.co/papers/2611.26107", "github": "https://github.com/ernie-research/HiUni", "summary_zh": ""}, {"id": "2611.26380", "title": "EgoCaptioner: Towards Comprehensive and Fine-Grained Egocentric Video Captioning", "upvotes": 25, "summary": "Egocentric video captioning requires fine-grained detail and accurate timing, yet current multimodal large language models (MLLMs) often miss brief actions, confuse their order, or misinterpret the wearer's motion. Existing caption formats also offer limited support for combining detailed narration ", "url": "https://huggingface.co/papers/2611.26380", "github": "https://github.com/cactusqq/EgoCaptioner", "summary_zh": ""}, {"id": "2611.26073", "title": "AltRA-Test: An Alternative Annotator Test for LLM Judges Without Shared Annotators", "upvotes": 23, "summary": "A statistical test, AltRA-Test, determines when large language models can replace human annotators by comparing inter-annotator agreement in resampled mixed human-LLM panels, and evaluations show it often requires about 100 items and makes better replacement decisions than baselines.", "url": "https://huggingface.co/papers/2611.26073", "github": null, "summary_zh": ""}, {"id": "2611.25387", "title": "TuringSpace: Grounding Spatial Intelligence in Action with Interactive CAPTCHAs", "upvotes": 23, "summary": "Humans act in the visual world by inferring the 3D layout behind a 2D view, predicting how an action changes it, and correcting themselves after seeing the result. Can multimodal large language models (MLLMs) do the same? CAPTCHAs offer a natural test, since humans solve them through this very loop,", "url": "https://huggingface.co/papers/2611.25387", "github": "https://github.com/os-cua-framework/TuringSpace", "summary_zh": ""}, {"id": "2611.26414", "title": "ZeroVLN: Learning to Navigate without Supervised Fine-Tuning of the VLM Brain", "upvotes": 22, "summary": "ZeroVLN is a slow-fast vision-language navigation framework that avoids navigation-domain supervised fine-tuning of the VLM brain by using a semantic tool-calling interface and closed-loop reinforcement learning to coordinate a language-based brain with an action expert, improving VLN-CE performance while preserving general visual capabilities.", "url": "https://huggingface.co/papers/2611.26414", "github": "https://github.com/hzx122/ZeroVLN", "summary_zh": ""}, {"id": "2611.26268", "title": "Accelerating Mixture of Block Attention via Dynamic Routing, KV-Centric Execution and Runtime Pipelining", "upvotes": 18, "summary": "LightningMoBA combines dynamic routing, KV-centric ownership, and runtime pipelining to accelerate long-context attention while maintaining or improving quality.", "url": "https://huggingface.co/papers/2611.26268", "github": "https://github.com/Tencent/LightningMoBA", "summary_zh": ""}, {"id": "2611.26627", "title": "RL Post-Training in Diffusion Transformers Is Activation Steering", "upvotes": 17, "summary": "A fixed set of steering vectors added to a frozen diffusion transformer recovers most of the quality gains from reinforcement learning post-training, indicating that much of the improvement comes from a constant shift rather than prompt-specific transformations.", "url": "https://huggingface.co/papers/2611.26627", "github": null, "summary_zh": ""}, {"id": "2611.24011", "title": "WAM-Policy: World Action Models with On-Policy Distillation for Quadrupedal Loco-Manipulation", "upvotes": 16, "summary": "Arm-free quadrupeds can perform loco-manipulation, walking on three legs while manipulating with a front leg, yet no existing policy for it follows language instructions. World action models (WAMs) have emerged as effective language-conditioned manipulation policies, but are pretrained for robot arm", "url": "https://huggingface.co/papers/2611.24011", "github": "https://github.com/AIGeeksGroup/WAM-Policy", "summary_zh": ""}, {"id": "2611.26408", "title": "Training Vision Models for LLM-Driven Weight-Space Programming", "upvotes": 15, "summary": "It has been demonstrated that, in certain settings, large language models can perform weight-space programming to directly modify the weights of neural networks. However, it is unknown how dedicated training of these networks can contribute to the successes of weight-space programming. We present a ", "url": "https://huggingface.co/papers/2611.26408", "github": null, "summary_zh": ""}, {"id": "2611.25980", "title": "Learning What Actions Change: Action Effect Matching for Dynamics-Faithful World Models", "upvotes": 15, "summary": "AFFECT, an auxiliary objective that trains world models to match visual responses to temporally correlated action noise, improves rollout fidelity and planning success in simulated and real robotic tasks.", "url": "https://huggingface.co/papers/2611.25980", "github": null, "summary_zh": ""}, {"id": "2611.24193", "title": "WM^MLLM: Turning MLLMs into World Models", "upvotes": 15, "summary": "WM^MLLM uses multimodal large language models to maintain an external panorama state with revision history, enabling persistent, editable world generation from a single image with exact revisits and local edits.", "url": "https://huggingface.co/papers/2611.24193", "github": "https://github.com/ztMotaLee/WM_mllm", "summary_zh": ""}, {"id": "2611.26510", "title": "AutoMaster: Autonomous Post-Training by Making the Same Model a Better Teacher", "upvotes": 14, "summary": "Task success alone does not specify which behaviors post-training should reinforce. Even successful teacher trajectories can contain unsupported assumptions, unproductive repetition, or superficial verification. We propose Skill-FT (Skill-Guided Fine-Tuning), which uses natural-language skills to su", "url": "https://huggingface.co/papers/2611.26510", "github": "https://github.com/RUCAIBox/AutoMaster", "summary_zh": ""}]};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
let D, cat = "全部";

// 收藏 / 已读：存在本浏览器
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("ghd:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ghd:" + k, JSON.stringify(v)); } catch {} },
};
let favs = store.get("favs", {}), read = new Set(store.get("read", []));
const saveRead = () => store.set("read", [...read].slice(-3000));

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) return "";
  const W = 64, H = 18, pts = ys.map((y, i) =>
    `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 2 - (y - lo) / (hi - lo) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="近 ${trend.length} 天 star 曲线">
    <title>${esc(trend[0][0])} ★${fmt(ys[0])} → ${esc(trend.at(-1)[0])} ★${fmt(ys.at(-1))}</title>
    <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function card(p) {
  const [owner, repo] = p.name.split("/");
  const flags = p.flags || [], related = p.related || [];
  const flagBadge = (kind, label) => flags.some(f => f.kind === kind) ? `<span class="badge warn">${label}</span>` : "";
  const relLabel = related.every(r => r.reason === "同作者") ? "同作者" : "同类";
  return `<article class="card ${p.suspect ? "suspect" : ""} ${read.has(p.name) ? "read" : ""}">
    <div class="top"><img src="${esc(p.owner_avatar)}&s=56" alt="" loading="lazy">
      <div class="name"><a class="main" href="${esc(p.url)}" target="_blank" rel="noopener" data-name="${esc(p.name)}"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a></div>
      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>

      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
