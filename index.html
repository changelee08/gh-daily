nguage models generate these plans one co", "url": "https://huggingface.co/papers/2611.08449", "github": null, "summary_zh": ""}, {"id": "2611.08373", "title": "SLA: Scaling Spatial-Language-Action Model via Continual Pre-training", "upvotes": 92, "summary": "SLA is a spatial-language-action model that continually pre-trains and post-trains a pretrained VLA policy with spatial alignment to a frozen 3D perception model, using feature-dependent gates and probabilistic state dropout to improve spatial understanding across diverse robot data while preserving inference architecture.", "url": "https://huggingface.co/papers/2611.08373", "github": null, "summary_zh": ""}, {"id": "2611.02075", "title": "Decoupled Predictive Decision Making: A Shared Conditional Predictor for Agents", "upvotes": 81, "summary": "DPDM improves agent decision accuracy by combining frozen language-model representations with a shared pretrained conditional predictor that learns from deployment evidence without parameter updates.", "url": "https://huggingface.co/papers/2611.02075", "github": null, "summary_zh": ""}, {"id": "2611.04277", "title": "Harness-S: Learning from Sibling Harnesses for Generalizable Agent Training", "upvotes": 66, "summary": "A selective harness-rescue training method uses specialized sibling harnesses to replace failed reinforcement learning rollouts and transfer their benefits into a single policy that performs better under the original base harness.", "url": "https://huggingface.co/papers/2611.04277", "github": "https://github.com/DeepExperience/Harness-S", "summary_zh": ""}, {"id": "2611.00883", "title": "Random Is Almost Enough? Stable and Low-Cost Benchmark Compression via BestRand", "upvotes": 51, "summary": "Benchmark compression reduces the often prohibitive time and cost of model evaluation by evaluating models on a small benchmark subset that closely matches full-benchmark results. To quantify estimation error, we derive an accurate analytical approximation to the error distribution when estimating f", "url": "https://huggingface.co/papers/2611.00883", "github": "https://github.com/George-Ling3/BestRand", "summary_zh": ""}, {"id": "2611.07392", "title": "WeLM-Image: A Unified Image Generation Model towards Visual Intelligence", "upvotes": 44, "summary": "We present WeLM-Image, a unified image foundation model that integrates multimodal understanding into text-to-image generation, instruction-guided editing, and multi-reference synthesis. Designed for single-GPU deployment in WeChat's large-scale consumer applications, the model processes text, refer", "url": "https://huggingface.co/papers/2611.07392", "github": null, "summary_zh": ""}, {"id": "2611.06741", "title": "TailSteer: Trajectory-Tail Steering for Drift-Resistant Multi-turn Image Editing", "upvotes": 40, "summary": "TailSteer, a final-stage training framework, reduces cumulative visual drift in multi-turn editing by keeping early denoising dynamics close to the base model and learning tail-focused preservation corrections from on-policy rollouts, preserving pretrained generative and editing abilities.", "url": "https://huggingface.co/papers/2611.06741", "github": "https://github.com/Lyricccco/tailsteer", "summary_zh": ""}, {"id": "2611.03743", "title": "EvoMemState: Evolving Memory State for Personal Agents", "upvotes": 33, "summary": "Long-term memory enables large language model (LLM) agents to provide continuous personalized assistance by retaining user information across interactions. Existing systems support this process through fact extraction, organization, updating, and retrieval, but largely maintain memories as independe", "url": "https://huggingface.co/papers/2611.03743", "github": "https://github.com/XMUDeepLIT/EvoMemState", "summary_zh": ""}, {"id": "2611.04408", "title": "Halley: A Predictive Control Plane for Optical AI Data Center Networks", "upvotes": 33, "summary": "Halley is a predictive control framework for AI data center optical networks that improves effective throughput and reduces capacity needs by forecasting failures and controlling resources with formal guarantees.", "url": "https://huggingface.co/papers/2611.04408", "github": null, "summary_zh": ""}, {"id": "2611.06817", "title": "Open-HumanScale: An Open Recipe for Scaling Human and Robot Experience for Embodied Foundation Models", "upvotes": 32, "summary": "Egocentric human video offers a scalable source of manipulation priors for robot learning, yet translating raw data scale into generalizable robot policies demands rigorous data curation and training recipes. We introduce Open-HumanScale, the first fully open recipe for scaling egocentric pretrainin", "url": "https://huggingface.co/papers/2611.06817", "github": null, "summary_zh": ""}, {"id": "2611.04894", "title": "VisSearch-Bench: Evaluating Long Horizon Visual Search in Multimodal Agents", "upvotes": 22, "summary": "VisSearch-Bench evaluates multimodal agents on visually intensive search tasks that require integrating visual context with external information, showing that even the best system fully solves only 26.47% of tasks.", "url": "https://huggingface.co/papers/2611.04894", "github": "https://github.com/antins-labs/VisSearch-Bench-v1", "summary_zh": ""}, {"id": "2611.07854", "title": "Towards Foundation Decision Models: Drex", "upvotes": 22, "summary": "Drex open decision models return probability distributions over user-supplied options without autoregressive decoding, using supervised fine-tuning, RLAF, and consistency losses to improve accuracy, robustness, and latency.", "url": "https://huggingface.co/papers/2611.07854", "github": "https://github.com/nace-ai/drex-decision-models", "summary_zh": ""}, {"id": "2611.06425", "title": "D3D: Decoupled Diffusion Drafting for Asynchronous Speculative Decoding", "upvotes": 20, "summary": "D3D is a standalone diffusion drafter that removes target-model hidden-state dependencies to enable asynchronous speculative decoding with high speedup.", "url": "https://huggingface.co/papers/2611.06425", "github": "https://github.com/fudan-generative-vision/D3D", "summary_zh": ""}, {"id": "2611.01926", "title": "TAC-CoT: Tool-Empowered Implicit Chain-of-Thought via Interleaving Explicit Tokens", "upvotes": 17, "summary": "TAC-CoT replaces explicit reasoning traces with compact latent segments while preserving textual tokens for tool interactions, improving agentic accuracy and reducing computation.", "url": "https://huggingface.co/papers/2611.01926", "github": null, "summary_zh": ""}, {"id": "2610.41432", "title": "Hybrid Computer Use: A Unified Programmatic, Semantic, and Visual Interface for General Agents", "upvotes": 17, "summary": "Hybrid Computer Use unifies programmatic, accessibility-based, and visual interaction channels to improve agent efficiency and success on complex desktop tasks.", "url": "https://huggingface.co/papers/2610.41432", "github": "https://github.com/microsoft/Hybrid-Computer-Use", "summary_zh": ""}, {"id": "2611.07909", "title": "EDGAR: Efficient Diffusion-Driven Gaussian Avatar Refinement via Synthetic Failure", "upvotes": 16, "summary": "EDGAR is a conditional diffusion framework with a fusion block and Mixture-of-Experts that refines degraded Gaussian head avatars by injecting self-supervised identity features, using refined multi-view renderings as pseudo-targets to optimize a single avatar.", "url": "https://huggingface.co/papers/2611.07909", "github": "https://github.com/kwanyun/edgar-code", "summary_zh": ""}, {"id": "2611.06976", "title": "On the Opportunities and Challenges of Prefill-to-Autoregressive Cross-Model Transfer", "upvotes": 15, "summary": "Prefill-to-Autoregressive Cross-model Transfer (PACT), a form of latent communication between language models, combines a larger model's prompt representations with a smaller model's efficient generation, offering a promising way to balance capability and inference cost. However, existing systems pr", "url": "https://huggingface.co/papers/2611.06976", "github": "https://github.com/zhenyi4/platour", "summary_zh": ""}, {"id": "2611.03852", "title": "Why Pay for Long Reasoning When Rewrite Do Trick? Causal Effects of Reasoning History Compaction on Future Generation and Agent Cost", "upvotes": 15, "summary": "Rewriting reasoning histories into compact state records reduces future reasoning length and token costs in open-weight models without retraining.", "url": "https://huggingface.co/papers/2611.03852", "github": null, "summary_zh": ""}, {"id": "2611.08376", "title": "Muir: Linear Attention with Sensitivity-Allocated Gating and Matched-Filter Readout", "upvotes": 12, "summary": "A linear attention architecture called Muir allocates gate capacity by sensitivity, uses matched-filter readout and a stable parallel update, improving language modeling, long-context recall, and training speed over Gated DeltaNet-2 and Transformer baselines.", "url": "https://huggingface.co/papers/2611.08376", "github": null, "summary_zh": ""}]};
const ARCHIVE = ["2026-11-09", "2026-11-06", "2026-11-05", "2026-11-04", "2026-11-03", "2026-11-02", "2026-11-01", "2026-10-30"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
let D, cat = "全部";

// 收藏 / 已读：存在本浏览器
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("ghd:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ghd:" + k, JSON.stringify(v)); } catch {} },
};
let favs = store.get("favs", {}), read = new Set(store.get("read", []));
const saveRead = () => store.set("read", [...read].slice(-3000));

function spark(trend) {
  if (!trend || trend.length < 2) return "";
  const ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) return "";
  const W = 64, H = 18, pts = ys.map((y, i) =>
    `${(i / (ys.length - 1) * W).toFixed(1)},${(H - 2 - (y - lo) / (hi - lo) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="近 ${trend.length} 天 star 曲线">
    <title>${esc(trend[0][0])} ★${fmt(ys[0])} → ${esc(trend.at(-1)[0])} ★${fmt(ys.at(-1))}</title>
    <polyline points="${pts}" fill="none" stroke="var(--hot)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function card(p) {
  const [owner, repo] = p.name.split("/");
  const flags = p.flags || [], related = p.related || [];
  const flagBadge = (kind, label) => flags.some(f => f.kind === kind) ? `<span class="badge warn">${label}</span>` : "";
  const relLabel = related.every(r => r.reason === "同作者") ? "同作者" : "同类";
  return `<article class="card ${p.suspect ? "suspect" : ""} ${read.has(p.name) ? "read" : ""}">
    <div class="top"><img src="${esc(p.owner_avatar)}&s=56" alt="" loading="lazy">
      <div class="name"><a class="main" href="${esc(p.url)}" target="_blank" rel="noopener" data-name="${esc(p.name)}"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a></div>
      <button class="fav ${favs[p.name] ? "on" : ""}" data-name="${esc(p.name)}" aria-label="收藏">${favs[p.name] ? "★" : "☆"}</button>
      <span class="rank">#${p.rank}</span></div>
    <p class="summary">${esc(p.summary)}</p>
    ${p.highlight ? `<p class="hl">${esc(p.highlight)}</p>` : ""}
    ${p.rising ? `<p class="rise">📈 近一周日均 +${fmt(Math.round(p.velocity))}，占总 star ${(p.rising.ratio * 100).toFixed(2)}%${p.rising.accel >= 1.5 ? `，是历史平均的 ${p.rising.accel} 倍` : ""}${p.rising.release_date ? ` · 最新版本 ${esc(p.rising.release || "")}（${esc(p.rising.release_date.slice(5))}）` : ""}</p>` : ""}
    ${flags.length ? `<p class="flags">${flags.map(f => "⚠ " + esc(f.text)).join("<br>")}</p>` : ""}
    <div class="foot">
      <div class="tags">
        <span class="badge">${esc(p.category)}</span>
        ${p.new ? `<span class="badge new">新上榜</span>` : ""}
        ${p.hn ? `<span class="badge hn">HN ${p.hn.points}</span>` : ""}
        ${flagBadge("suspect", "疑似刷星")}${flagBadge("migrated", "迁移/首次公开")}${flagBadge("rehost", "搬运")}
      </div>
      <div class="meta">
        <span class="vel">${p.velocity_measured ? "" : "≈"}+${fmt(p.velocity)}/天</span>
        <span>★ ${fmt(p.stars)}</span>
        <span>${p.age} 天前创建</span>
        ${p.language ? `<span class="lang">${esc(p.language)}</span>` : ""}
        ${spark(p.trend)}
      </div>
    </div>
    ${related.length ? `<details class="related"><summary>${relLabel} ${related.length} 个：${related.map(r => esc(r.name.split("/")[1])).join("、")}</summary>
      <ul>${related.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> ★${fmt(r.stars)}${r.suspect ? " ⚠疑似刷星" : ""}<br>${esc(r.summary)}</li>`).join("")}</ul></details>` : ""}
  </article>`;
}

function renderProjects() {
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = D.projects.map((p, i) => ({...p, rank: i + 1}));
  if ($("#hideSuspect").checked) list = list.filter(p => !p.suspect);
  if ($("#hideRead").checked) list = list.filter(p => !read.has(p.name));
  if (cat !== "全部") list = list.filter(p => p.category === cat);
  if ($("#onlyNew").checked) list = list.filter(p => p.new);
  if (q) list = list.filter(p => [p.name, p.summary, p.description, p.topics.join(" "),
    ...(p.related || []).map(r => r.name + " " + r.summary)].join(" ").toLowerCase().includes(q));
  const key = {score: p => -(p.adj_score ?? p.score), velocity: p => -p.velocity, age: p => p.age, stars: p => -p.stars}[sort];
  list.sort((a, b) => key(a) - key(b));
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的项目</div>`;
}

function renderRising() {
  const list = (D.rising || []).map((p, i) => ({...p, rank: i + 1}));
  $("#risingGrid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">今天没有符合条件的项目</div>`;
}

function renderChips() {
  const counts = {};
  D.projects.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = ["全部", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  if (!cats.includes(cat)) cat = "全部";
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)} ${c === "全部" ? D.projects.length : counts[c]}</button>`).join("");
}

function renderHN() {
  $("#hnList").innerHTML = D.hn.map(h => `<div class="row">
    <div class="pts">${h.points}<small>points</small></div>
    <div><a class="t" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title_zh || h.title)}</a>
      ${h.title_zh ? `<div class="d">${esc(h.title)}</div>` : ""}
      <div class="links"><a href="${esc(h.hn_url)}" target="_blank" rel="noopener">${h.comments} 条讨论</a>
      ${h.github ? `<a href="https://github.com/${esc(h.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderPapers() {
  $("#paperList").innerHTML = D.papers.map(p => `<div class="row">
    <div class="pts">${p.upvotes}<small>upvotes</small></div>
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="d">${esc(p.summary_zh || p.summary)}</div>
      ${p.github ? `<div class="links"><a href="${esc(p.github)}" target="_blank" rel="noopener">代码</a></div>` : ""}</div>
  </div>`).join("") || `<div class="empty">暂无</div>`;
}

function renderFavs() {
  const list = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  $("#n-favs").textContent = list.length || "";
  $("#favList").innerHTML = list.map(f => `<div class="row">
    <div class="pts">★${fmt(f.stars)}<small>${esc(f.date)}</small></div>
    <div><a class="t" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <div class="d">${esc(f.summary)}</div>
      <div class="links"><button data-unfav="${esc(f.name)}">取消收藏</button></div></div>
  </div>`).join("") || `<div class="empty">还没有收藏。点项目卡片右上角的 ☆ 收藏，收藏保存在本浏览器。</div>`;
}

function toggleFav(name) {
  if (favs[name]) delete favs[name];
  else {
    const p = [...D.projects, ...(D.rising || [])].find(p => p.name === name);
    if (!p) return;
    favs[name] = {name, url: p.url, summary: p.summary, stars: p.stars, date: D.date, saved: new Date().toISOString()};
  }
  store.set("favs", favs);
  renderFavs();
}

function load(data) {
  D = data;
  $("#sub").textContent = `${D.date} · 生成于 ${D.generated.replace("T", " ")} · 数据源：GitHub Search / Hacker News / Hugging Face Papers`;
  $("#overview").innerHTML = D.overview ? `<b>今日导读</b>${esc(D.overview)}` : "";
  $("#overview").classList.toggle("hide", !D.overview);
  $("#n-projects").textContent = D.projects.length;
  const ns = D.projects.filter(p => p.suspect).length;
  $("#nSuspect").textContent = ns ? `（${ns}）` : "";
  $("#n-rising").textContent = (D.rising || []).length || "";
  $("#n-hn").textContent = D.hn.length;
  $("#n-papers").textContent = D.papers.length;
  renderChips(); renderProjects(); renderRising(); renderHN(); renderPapers(); renderFavs();
}

$("#day").innerHTML = ARCHIVE.map(d => `<option>${d}</option>`).join("");
$("#day").value = EMBED.date;
$("#day").onchange = async e => {
  try { load(await (await fetch(`data/${e.target.value}.json`)).json()); }
  catch { alert("切换往期需要通过 http 打开页面（例如 python3 -m http.server）"); e.target.value = D.date; }
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["projects", "rising", "hn", "papers", "favs"].forEach(id => $("#" + id).classList.toggle("hide", id !== t.dataset.tab));
});
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { cat = c.dataset.c; renderChips(); renderProjects(); } };
const onCardClick = e => {
  const fav = e.target.closest(".fav");
  if (fav) {
    toggleFav(fav.dataset.name);
    fav.classList.toggle("on", !!favs[fav.dataset.name]);
    fav.textContent = favs[fav.dataset.name] ? "★" : "☆";
    return;
  }
  const main = e.target.closest("a.main");
  if (main) {
    read.add(main.dataset.name); saveRead();
    main.closest(".card").classList.add("read");
  }
};
$("#grid").addEventListener("click", onCardClick);
$("#risingGrid").addEventListener("click", onCardClick);
$("#favList").addEventListener("click", e => {
  const b = e.target.closest("[data-unfav]");
  if (b) { toggleFav(b.dataset.unfav); renderProjects(); renderRising(); }
});
["#q", "#sort", "#onlyNew", "#hideRead", "#hideSuspect"].forEach(s => $(s).addEventListener("input", renderProjects));
load(EMBED);
</script>
</body>
</html>
